<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="698" viewBox="0 0 1700 698"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Per-resource preparation: requested versus observed</text><text x="20" y="54" font-size="14">C2A: shared service/wake resource contract and driver. Kuaru ownership adoption is C2B.</text><rect x="8" y="75" width="324" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="170" y="103" text-anchor="middle" font-size="12">Consumer / future Kuaru adapter</text><path d="M170 123V686" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="348" y="75" width="324" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="510" y="103" text-anchor="middle" font-size="12">SessionPreparation / ManagedSession</text><path d="M510 123V686" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="688" y="75" width="324" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="850" y="103" text-anchor="middle" font-size="12">AndroidSessionPreparation</text><path d="M850 123V686" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1028" y="75" width="324" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1190" y="103" text-anchor="middle" font-size="12">AndroidSessionResourceDriver (JNI)</text><path d="M1190 123V686" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1368" y="75" width="324" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1530" y="103" text-anchor="middle" font-size="12">Shared Java service / wake lock</text><path d="M1530 123V686" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="15" y="142" width="1670" height="23" fill="white"/><text x="22" y="159" font-size="14">1. Explicitly request background-audio service or CPU-awake resource outside the realtime callback.</text><path d="M170 166H510" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="216" width="1670" height="23" fill="white"/><text x="22" y="233" font-size="14">2. Check capability and ownership; a resource already active outside this session is not silently adopted.</text><path d="M850 240H1190" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="290" width="1670" height="23" fill="white"/><text x="22" y="307" font-size="14">3. Invoke the existing service start or partial-wake acquire operation.</text><path d="M1190 314H1530" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="364" width="1670" height="23" fill="white"/><text x="22" y="381" font-size="14">4. Service start accepted may still be pending; wake acquisition reports actual isHeld separately.</text><path d="M1530 388H1190" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="438" width="1670" height="23" fill="white"/><text x="22" y="455" font-size="14">5. Return native acceptance plus a consistent read-only state snapshot; preserve specific Java/JNI errors.</text><path d="M1190 462H850" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="512" width="1670" height="23" fill="white"/><text x="22" y="529" font-size="14">6. Expose pending/running/held/unavailable/failure distinctly; focus activation does not imply these resources are ready.</text><path d="M510 536H170" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="586" width="1670" height="23" fill="white"/><text x="22" y="603" font-size="14">7. Explicit observation refresh reads current state on the caller thread; no polling timer or synchronous main-loop wait.</text><path d="M170 610H510" stroke="#315c91" marker-end="url(#a)"/></g></svg>
