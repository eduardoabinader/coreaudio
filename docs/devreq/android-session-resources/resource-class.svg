<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="698" viewBox="0 0 1700 698"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Shared session resources: ownership and compatibility</text><text x="20" y="54" font-size="14">C2A: shared service/wake resource contract and driver. Kuaru ownership adoption is C2B.</text><rect x="8" y="75" width="324" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="170" y="103" text-anchor="middle" font-size="12">Consumer / future Kuaru adapter</text><path d="M170 123V686" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="348" y="75" width="324" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="510" y="103" text-anchor="middle" font-size="12">SessionPreparation / ManagedSession</text><path d="M510 123V686" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="688" y="75" width="324" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="850" y="103" text-anchor="middle" font-size="12">AndroidSessionPreparation</text><path d="M850 123V686" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1028" y="75" width="324" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1190" y="103" text-anchor="middle" font-size="12">AndroidSessionResourceDriver (JNI)</text><path d="M1190 123V686" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1368" y="75" width="324" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1530" y="103" text-anchor="middle" font-size="12">Shared Java service / wake lock</text><path d="M1530 123V686" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="15" y="142" width="1670" height="23" fill="white"/><text x="22" y="159" font-size="14">1. Neutral per-resource requests/reports are added to SessionPreparation; existing focus prepare remains compatible.</text><path d="M170 166H510" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="216" width="1670" height="23" fill="white"/><text x="22" y="233" font-size="14">2. ManagedSession serializes non-realtime resource operations and stores reports separately from focus readiness.</text><path d="M510 240H850" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="290" width="1670" height="23" fill="white"/><text x="22" y="307" font-size="14">3. Android backend owns an optional injected resource driver; tests use a fake without JNI or hardware.</text><path d="M850 314H1190" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="364" width="1670" height="23" fill="white"/><text x="22" y="381" font-size="14">4. JNI driver receives explicit context and helper classes, retaining refs without a consumer checkout/package dependency.</text><path d="M1190 388H1530" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="438" width="1670" height="23" fill="white"/><text x="22" y="455" font-size="14">5. Reuse AudioForegroundService and AudioPartialWakeLock; add read-only state/error snapshots with old APIs preserved.</text><path d="M1530 462H1530" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="512" width="1670" height="23" fill="white"/><text x="22" y="529" font-size="14">6. Report request, operation acceptance, observed state, ownership and specific error; unsupported is explicit.</text><path d="M510 536H170" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="586" width="1670" height="23" fill="white"/><text x="22" y="603" font-size="14">7. C2A does not switch Kuaru ownership or change ordering; C2B must hand off without overlapping legacy owners.</text><path d="M170 610H170" stroke="#315c91" marker-end="url(#a)"/></g></svg>
