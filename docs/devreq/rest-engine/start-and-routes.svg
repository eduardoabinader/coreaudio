ll="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="118" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Project code</text><text x="118" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">(domain handlers)</text><path d="M323 128V771" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="323" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">gigante::RestServer</text><path d="M528 128V771" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="528" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">SecurityPolicy</text><path d="M733 128V771" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="733" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">Router</text><path d="M938 128V771" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="938" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">CommonEndpoints</text><path d="M1143 128V771" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1047" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1143" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpTransport</text><text x="1143" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">(CppHttplibTransport)</text><rect x="8" y="142" width="1245" height="24" fill="#e7f6ec"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Normal path</text><path d="M118 194H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="81" y="172" width="279" height="17" fill="white"/><text x="220.5" y="186" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">RestServer(config: profile, limits, TLS)</text><path d="M118 225H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="101" y="203" width="238" height="17" fill="white"/><text x="220.5" y="217" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET("/api/v1/items/{id}", handler)</text><path d="M323 256H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="422" y="234" width="212" height="17" fill="white"/><text x="528.0" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">add route + auth + idempotency</text><path d="M118 287H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="192" y="265" width="57" height="17" fill="white"/><text x="220.5" y="279" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">start()</text><path d="M323 318H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="310" y="296" width="232" height="17" fill="white"/><text x="425.5" y="310" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">check profile, bind, certificates</text><path d="M528 349H325" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="336" y="327" width="178" height="17" fill="white"/><text x="425.5" y="341" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">allowed; effective config</text><path d="M323 380H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="511" y="358" width="238" height="17" fill="white"/><text x="630.5" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">register always-on /core/v1 routes</text><path d="M938 411H735" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="773" y="389" width="124" height="17" fill="white"/><text x="835.5" y="403" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">add common routes</text><path d="M323 442H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="668" y="420" width="131" height="17" fill="white"/><text x="733.0" y="434" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">start; bind routes</text><path d="M1143 473H325" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="654" y="451" width="158" height="17" fill="white"/><text x="733.0" y="465" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">bound address and port</text><path d="M323 504H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="192" y="482" width="57" height="17" fill="white"/><text x="220.5" y="496" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">running</text><rect x="8" y="519" width="1245" height="24" fill="#fdecea"/><text x="16" y="536" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Failure paths: nothing starts</text><path d="M118 571H321" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="111" y="549" width="218" height="17" fill="white"/><text x="220.5" y="563" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">GET("/core/v1/health", handler)</text><path d="M733 602H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="303" y="580" width="245" height="17" fill="white"/><text x="425.5" y="594" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">reserved prefix: registration fails</text><path d="M118 633H321" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="118" y="611" width="205" height="17" fill="white"/><text x="220.5" y="625" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">same method and pattern twice</text><path d="M733 664H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="303" y="642" width="245" height="17" fill="white"/><text x="425.5" y="656" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">duplicate route: registration fails</text><path d="M1143 695H325" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="691" y="673" width="84" height="17" fill="white"/><text x="733.0" y="687" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">port in use</text><path d="M323 726H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="68" y="704" width="306" height="17" fill="white"/><text x="220.5" y="718" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">start fails with cause; server stays stopped</text></g></svg>
