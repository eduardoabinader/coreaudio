<svg xmlns="http://www.w3.org/2000/svg" width="1261" height="846" viewBox="0 0 1261 846"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">startService and stopService: reply first, then act</text><text x="20" y="56" font-size="14">Agreed gigante::restcore architecture. Implemented through R1; items marked R2 or R6 are planned.</text><rect x="501" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="525" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="651" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="675" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="801" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="825" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="951" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="975" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1101" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1125" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><path d="M118 128V836" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="22" y="78" width="192" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="118" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Remote client</text><path d="M323 128V836" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="323" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpTransport</text><text x="323" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">(CppHttplibTransport)</text><path d="M528 128V836" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="528" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">MiddlewareChain</text><path d="M733 128V836" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="733" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">ServiceRegistry</text><path d="M938 128V836" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="938" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Project providers</text><path d="M1143 128V836" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1047" y="78" width="192" height="50" rx="6" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="1143" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">gigante::RestServer</text><rect x="8" y="142" width="1245" height="24" fill="#e7f6ec"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Normal path, for a logical service the host registered</text><path d="M118 194H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="95" y="172" width="252" height="17" fill="white"/><text x="220.5" y="186" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">POST /core/v1/services/capture/start</text><path d="M323 225H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="380" y="203" width="91" height="17" fill="white"/><text x="425.5" y="217" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">authenticate</text><path d="M528 256H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="555" y="234" width="151" height="17" fill="white"/><text x="630.5" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">startService(capture)</text><path d="M733 287H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="336" y="265" width="178" height="17" fill="white"/><text x="425.5" y="279" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">202 Accepted + request ID</text><path d="M733 318H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="676" y="296" width="319" height="17" fill="white"/><text x="835.5" y="310" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">start callback on the registry's worker thread</text><path d="M938 349H735" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="780" y="327" width="111" height="17" fill="white"/><text x="835.5" y="341" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">result recorded</text><path d="M118 380H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="152" y="358" width="138" height="17" fill="white"/><text x="220.5" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET /core/v1/status</text><path d="M733 411H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="367" y="389" width="118" height="17" fill="white"/><text x="425.5" y="403" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">capture: running</text><rect x="8" y="426" width="1245" height="24" fill="#fdecea"/><text x="16" y="443" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Failure paths</text><path d="M733 478H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="259" y="456" width="333" height="17" fill="white"/><text x="425.5" y="470" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">404: service not registered; lifecycle is opt-in</text><path d="M938 509H735" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="783" y="487" width="104" height="17" fill="white"/><text x="835.5" y="501" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">callback fails</text><path d="M733 540H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="293" y="518" width="265" height="17" fill="white"/><text x="425.5" y="532" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">status reports failed, with safe cause</text><rect x="8" y="555" width="1245" height="24" fill="#eef2ff"/><text x="16" y="572" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Stopping the server itself: drain after the reply</text><path d="M118 607H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="101" y="585" width="238" height="17" fill="white"/><text x="220.5" y="599" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">POST /core/v1/services/server/stop</text><path d="M733 638H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="380" y="616" width="91" height="17" fill="white"/><text x="425.5" y="630" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">202 Accepted</text><path d="M733 669H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="762" y="647" width="353" height="17" fill="white"/><text x="938.0" y="661" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">requestStop(): runs on the server's own stop thread</text><rect x="8" y="684" width="1245" height="24" fill="#eef2ff"/><text x="16" y="701" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Not a handler or worker thread: stop waits for those, so it would wait on itself</text><path d="M1143 736h-30v20h28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><text x="1105" y="742" text-anchor="end" font-size="12" font-weight="400" fill="#172033">graceful shutdown (see shutdown diagram)</text><rect x="8" y="770" width="1245" height="24" fill="#eef2ff"/><text x="16" y="787" text-anchor="start" font-size="13" font-weight="700" fill="#172033">This cannot start a stopped process: first start stays with deployment tooling</text></g></svg>
