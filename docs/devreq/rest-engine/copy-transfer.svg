<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1261" viewBox="0 0 1560 1261"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">copy family: list, upload with resume, download with Range, failures</text><text x="20" y="56" font-size="14">Proposed R2 design, for approval. Built on R1 (implemented); nothing in R2 is implemented yet.</text><rect x="800" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="824" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="950" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="974" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1100" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1124" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1250" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1274" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1400" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1424" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><path d="M118 128V1251" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="22" y="78" width="192" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="118" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Remote client</text><path d="M323 128V1251" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="323" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpTransport</text><text x="323" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">(CppHttplibTransport)</text><path d="M528 128V1251" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="528" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">Router +</text><text x="528" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">MiddlewareChain</text><path d="M733 128V1251" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="733" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">CapacityGate</text><path d="M938 128V1251" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="938" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">CopyService</text><path d="M1143 128V1251" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1047" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1143" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">Sha256</text><path d="M1348 128V1251" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1252" y="78" width="192" height="50" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1348" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">RestResourceStore</text><text x="1348" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">(project)</text><rect x="8" y="142" width="1544" height="24" fill="#e7f6ec"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Discover</text><path d="M118 194H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="105" y="172" width="232" height="17" fill="white"/><text x="220.5" y="186" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET /core/v1/resources (copyList)</text><path d="M938 225H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1118" y="203" width="50" height="17" fill="white"/><text x="1143.0" y="217" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">list()</text><path d="M938 256H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="429" y="234" width="198" height="17" fill="white"/><text x="528.0" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">resource IDs, sizes, digests</text><rect x="8" y="271" width="1544" height="24" fill="#e7f6ec"/><text x="16" y="288" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Upload: authentication and size checks before any body is read</text><path d="M118 323H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="71" y="301" width="299" height="17" fill="white"/><text x="220.5" y="315" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">POST /core/v1/copy {resource, size, sha256}</text><path d="M528 354H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="647" y="332" width="171" height="17" fill="white"/><text x="733.0" y="346" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">authenticated copyCreate</text><path d="M938 385H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1054" y="363" width="178" height="17" fill="white"/><text x="1143.0" y="377" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">describe(id), freeBytes()</text><path d="M938 416H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="456" y="394" width="144" height="17" fill="white"/><text x="528.0" y="408" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">transferId, offset 0</text><path d="M118 447H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="47" y="425" width="346" height="17" fill="white"/><text x="220.5" y="439" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">PUT /core/v1/copy/{transferId}, X-Upload-Offset: 0</text><path d="M323 478H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="456" y="456" width="144" height="17" fill="white"/><text x="528.0" y="470" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">tryAcquireTransfer()</text><path d="M938 509H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1041" y="487" width="205" height="17" fill="white"/><text x="1143.0" y="501" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">beginUpload(): RestUploadSink</text><path d="M323 540H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="437" y="518" width="386" height="17" fill="white"/><text x="630.5" y="532" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">content reader, chunk by chunk, within the body deadline</text><path d="M938 571H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1015" y="549" width="50" height="17" fill="white"/><text x="1040.5" y="563" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">update</text><path d="M938 602H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1081" y="580" width="124" height="17" fill="white"/><text x="1143.0" y="594" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">sink.write(chunk)</text><rect x="8" y="617" width="1544" height="24" fill="#eef2ff"/><text x="16" y="634" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Interrupted: resume within the window</text><path d="M118 669H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="71" y="647" width="299" height="17" fill="white"/><text x="220.5" y="661" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET /core/v1/copy/{transferId} (copyStatus)</text><path d="M938 700H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="479" y="678" width="97" height="17" fill="white"/><text x="528.0" y="692" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">bytesReceived</text><path d="M118 731H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="84" y="709" width="272" height="17" fill="white"/><text x="220.5" y="723" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">PUT ..., X-Upload-Offset: bytesReceived</text><path d="M938 762H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="988" y="740" width="104" height="17" fill="white"/><text x="1040.5" y="754" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">digest matches</text><path d="M938 793H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1067" y="771" width="151" height="17" fill="white"/><text x="1143.0" y="785" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">sink.commit(): atomic</text><path d="M938 824H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="493" y="802" width="70" height="17" fill="white"/><text x="528.0" y="816" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">committed</text><rect x="8" y="839" width="1544" height="24" fill="#e7f6ec"/><text x="16" y="856" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Download</text><path d="M118 891H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="98" y="869" width="245" height="17" fill="white"/><text x="220.5" y="883" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET /core/v1/resources/{id} + Range</text><path d="M938 922H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1037" y="900" width="212" height="17" fill="white"/><text x="1143.0" y="914" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">openRead(): RestDownloadSource</text><path d="M323 953H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="118" y="931" width="205" height="17" fill="white"/><text x="220.5" y="945" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">206 chunks, bandwidth-limited</text><rect x="8" y="968" width="1544" height="24" fill="#fdecea"/><text x="16" y="985" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Failure paths: no partial result is ever visible</text><path d="M938 1020H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="345" y="998" width="366" height="17" fill="white"/><text x="528.0" y="1012" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">unknown or path-like ID: 404; the store never sees it</text><path d="M938 1051H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="382" y="1029" width="292" height="17" fill="white"/><text x="528.0" y="1043" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">over size, or not enough space: 413 or 507</text><path d="M938 1082H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="362" y="1060" width="333" height="17" fill="white"/><text x="528.0" y="1074" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">wrong X-Upload-Offset: 409 with the right offset</text><path d="M938 1113H1346" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="1037" y="1091" width="212" height="17" fill="white"/><text x="1143.0" y="1105" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">digest differs: sink.discard()</text><path d="M118 1144H321" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="61" y="1122" width="319" height="17" fill="white"/><text x="220.5" y="1136" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">DELETE /core/v1/copy/{transferId} (copyCancel)</text><path d="M938 1175H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="973" y="1153" width="339" height="17" fill="white"/><text x="1143.0" y="1167" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">discard now; abandoned transfers after the window</text><path d="M733 1206H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="300" y="1184" width="252" height="17" fill="white"/><text x="425.5" y="1198" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">transfer cap reached: structured 503</text></g></svg>
