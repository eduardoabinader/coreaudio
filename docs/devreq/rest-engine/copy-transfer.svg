<svg xmlns="http://www.w3.org/2000/svg" width="1466" height="1034" viewBox="0 0 1466 1034"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">copy family: streaming transfer, cancel and failure</text><text x="20" y="56" font-size="14">Agreed gigante::restcore architecture. Implemented through R1; items marked R2 or R6 are planned.</text><rect x="706" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="730" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="856" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="880" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1006" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1030" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1156" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1180" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1306" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1330" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><path d="M118 128V1024" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="22" y="78" width="192" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="118" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Remote client</text><path d="M323 128V1024" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="323" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpTransport</text><text x="323" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">(CppHttplibTransport)</text><path d="M528 128V1024" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="528" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">MiddlewareChain</text><path d="M733 128V1024" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="733" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">CapacityGate</text><path d="M938 128V1024" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="938" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">CopyService</text><path d="M1143 128V1024" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1047" y="78" width="192" height="50" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1143" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">ResourceStore</text><text x="1143" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">(project provider)</text><path d="M1348 128V1024" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1252" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1348" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">RestMetrics</text><rect x="8" y="142" width="1450" height="24" fill="#e7f6ec"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Upload: requests name resource IDs, never paths</text><path d="M118 194H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="84" y="172" width="272" height="17" fill="white"/><text x="220.5" y="186" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">POST copyCreate(resource, size, digest)</text><path d="M323 225H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="326" y="203" width="198" height="17" fill="white"/><text x="425.5" y="217" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">authenticate before the body</text><path d="M528 256H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="694" y="234" width="77" height="17" fill="white"/><text x="733.0" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">copyCreate</text><path d="M938 287H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="941" y="265" width="198" height="17" fill="white"/><text x="1040.5" y="279" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">resolve ID; check free space</text><path d="M938 318H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="489" y="296" width="77" height="17" fill="white"/><text x="528.0" y="310" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">transferId</text><path d="M118 349H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="128" y="327" width="185" height="17" fill="white"/><text x="220.5" y="341" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">PUT copyUpload(transferId)</text><path d="M323 380H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="456" y="358" width="144" height="17" fill="white"/><text x="528.0" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">tryAcquireTransfer()</text><path d="M323 411H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="525" y="389" width="212" height="17" fill="white"/><text x="630.5" y="403" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">content reader, chunk by chunk</text><path d="M938 442H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="928" y="420" width="225" height="17" fill="white"/><text x="1040.5" y="434" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">append to staging; update digest</text><path d="M938 473H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="938" y="451" width="205" height="17" fill="white"/><text x="1040.5" y="465" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">digest matches: atomic commit</text><path d="M938 504H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="466" y="482" width="124" height="17" fill="white"/><text x="528.0" y="496" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">committed, digest</text><path d="M938 535H735" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="783" y="513" width="104" height="17" fill="white"/><text x="835.5" y="527" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">lease released</text><rect x="8" y="550" width="1450" height="24" fill="#e7f6ec"/><text x="16" y="567" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Download and resume</text><path d="M118 602H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="101" y="580" width="238" height="17" fill="white"/><text x="220.5" y="594" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET copyDownload(resource) + Range</text><path d="M938 633H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1002" y="611" width="77" height="17" fill="white"/><text x="1040.5" y="625" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">read chunk</text><path d="M938 664H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="426" y="642" width="205" height="17" fill="white"/><text x="528.0" y="656" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">206 chunks, bandwidth-limited</text><path d="M118 695H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="449" y="673" width="158" height="17" fill="white"/><text x="528.0" y="687" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">copyStatus(transferId)</text><path d="M938 726H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="452" y="704" width="151" height="17" fill="white"/><text x="528.0" y="718" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">bytes received, state</text><rect x="8" y="741" width="1450" height="24" fill="#fdecea"/><text x="16" y="758" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Failure paths: no partial destination is ever visible</text><path d="M938 793H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="345" y="771" width="366" height="17" fill="white"/><text x="528.0" y="785" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">unknown ID, or a path-like value: 404, no file access</text><path d="M938 824H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="395" y="802" width="265" height="17" fill="white"/><text x="528.0" y="816" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">too large or no free space: 413 or 507</text><path d="M938 855H1141" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="931" y="833" width="218" height="17" fill="white"/><text x="1040.5" y="847" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">digest differs: discard staging</text><path d="M938 886H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="469" y="864" width="118" height="17" fill="white"/><text x="528.0" y="878" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">structured error</text><path d="M118 917H321" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="115" y="895" width="212" height="17" fill="white"/><text x="220.5" y="909" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">copyCancel, or connection lost</text><path d="M938 948H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="881" y="926" width="319" height="17" fill="white"/><text x="1040.5" y="940" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">cancel: discard now; lost: after resume window</text><path d="M938 979H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1084" y="957" width="118" height="17" fill="white"/><text x="1143.0" y="971" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">transfer outcome</text></g></svg>
