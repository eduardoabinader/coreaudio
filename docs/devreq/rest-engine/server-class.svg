<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="960" viewBox="0 0 1840 960"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">restcore server: class collaborations</text><text x="20" y="56" font-size="14">Agreed gigante::restcore architecture. Implemented through R1; items marked R2 or R6 are planned.</text><rect x="1080" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1104" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="1230" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="1254" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1380" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1404" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1530" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1554" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1680" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1704" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><rect x="30" y="90" width="270" height="85" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="165.0" y="112" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">Domain handlers</text><text x="165.0" y="132" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">run on server threads,</text><text x="165.0" y="149" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">concurrently, by default</text><rect x="30" y="210" width="270" height="100" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="165.0" y="232" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">Project providers</text><text x="165.0" y="252" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">health checks, service callbacks,</text><text x="165.0" y="269" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">ResourceStore, stream data</text><rect x="30" y="345" width="270" height="80" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="165.0" y="367" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">Project dispatcher</text><text x="165.0" y="387" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">optional: Qt or JUCE handoff</text><rect x="30" y="470" width="270" height="70" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="165.0" y="492" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">Logger context</text><text x="165.0" y="512" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">injected gigante::Logger</text><rect x="370" y="90" width="290" height="90" rx="7" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="515.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">RestRequest, RestResponse</text><text x="515.0" y="132" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">RestConfig with SecurityProfile</text><text x="515.0" y="149" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">plain values; no library types</text><rect x="370" y="250" width="290" height="180" rx="7" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="515.0" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">gigante::RestServer</text><text x="515.0" y="292" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET, POST, ..., start, stop</text><text x="515.0" y="309" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">created &gt; running &gt; draining &gt; stopped</text><text x="515.0" y="326" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">own stop thread for self-stop</text><text x="515.0" y="343" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">no callback after destroy</text><text x="515.0" y="360" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">no global state: many instances</text><rect x="370" y="480" width="290" height="80" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="515.0" y="502" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">RestMetrics</text><text x="515.0" y="522" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">counters and limit usage</text><rect x="740" y="90" width="290" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="885.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">Router</text><text x="885.0" y="132" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">{id} patterns, path validation</text><text x="885.0" y="149" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">duplicate or /core/v1 route fails</text><rect x="740" y="215" width="290" height="90" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="885.0" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">MiddlewareChain</text><text x="885.0" y="257" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">request IDs, auth, CORS</text><text x="885.0" y="274" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">size limit before body read</text><rect x="740" y="335" width="290" height="90" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="885.0" y="357" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">SecurityPolicy</text><text x="885.0" y="377" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">refuses plaintext in production</text><text x="885.0" y="394" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">per-route auth decision</text><rect x="740" y="455" width="290" height="90" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="885.0" y="477" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">HandlerDispatcher</text><text x="885.0" y="497" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">optional interface; full gives 503,</text><text x="885.0" y="514" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">missed deadline gives 504</text><rect x="740" y="575" width="290" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="885.0" y="597" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">CommonEndpoints</text><text x="885.0" y="617" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">always on: health, heartbeat,</text><text x="885.0" y="634" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">status, version, capabilities</text><rect x="1100" y="90" width="280" height="90" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1240.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">ServiceRegistry</text><text x="1240.0" y="132" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">opt-in; replies 202, then runs</text><text x="1240.0" y="149" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">callback on its worker thread</text><rect x="1100" y="205" width="280" height="90" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1240.0" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">CopyService</text><text x="1240.0" y="247" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">opt-in, R2: resource IDs,</text><text x="1240.0" y="264" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">digest, atomic commit</text><rect x="1100" y="320" width="280" height="90" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1240.0" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">DiagnosticsEndpoints</text><text x="1240.0" y="362" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">opt-in, R2: getLog, cmdStatus,</text><text x="1240.0" y="379" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">appendLogMarker</text><rect x="1100" y="435" width="280" height="90" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1240.0" y="457" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">DeployService</text><text x="1240.0" y="477" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">R6: build flag, off by default</text><text x="1240.0" y="494" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">never executes a payload</text><rect x="1100" y="550" width="280" height="90" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1240.0" y="572" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">CapacityGate</text><text x="1240.0" y="592" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stream and transfer caps</text><text x="1240.0" y="609" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">issues RAII CapacityLease</text><rect x="1100" y="665" width="280" height="80" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1240.0" y="687" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">StreamHub</text><text x="1240.0" y="707" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">opt-in, R2: declared streams</text><rect x="1100" y="775" width="280" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1240.0" y="797" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">StreamSession</text><text x="1240.0" y="817" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">bounded queue, holds a lease</text><text x="1240.0" y="834" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">DeliveryPolicy</text><rect x="1460" y="215" width="350" height="90" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1635.0" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">HttpTransport</text><text x="1635.0" y="257" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">interface: start, stop, addRoute,</text><text x="1635.0" y="274" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">TransportRequest, TransportWriter</text><rect x="1460" y="355" width="350" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1635.0" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">CppHttplibTransport</text><text x="1635.0" y="397" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">only server code including httplib.h</text><text x="1635.0" y="414" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">explicit pool and queue limits</text><rect x="1460" y="510" width="350" height="75" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1635.0" y="532" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">httplib::Server / SSLServer</text><text x="1635.0" y="552" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">routes, keep-alive, timeouts</text><rect x="1460" y="630" width="350" height="75" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1635.0" y="652" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">httplib::ThreadPool, DataSink</text><text x="1635.0" y="672" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">one thread per open connection</text><rect x="1460" y="750" width="350" height="75" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1635.0" y="772" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">OpenSSL 3.x or Mbed TLS 3.6.7+</text><text x="1635.0" y="792" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">chosen at build time</text><path d="M300 132H335V300H368" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="302" y="187" width="65" height="16" fill="white"/><text x="335" y="200" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">registers</text><path d="M300 260H335" fill="none" stroke="#315c91" stroke-width="1.4"/><path d="M300 385H368" fill="none" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="304" y="364" width="59" height="16" fill="white"/><text x="334" y="377" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">injected</text><path d="M368 415H335V505H302" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="305" y="452" width="59" height="16" fill="white"/><text x="335" y="465" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">logs via</text><path d="M515 250V182" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="529" y="209" width="47" height="16" fill="white"/><text x="552" y="222" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">values</text><path d="M515 430V478" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="529" y="445" width="53" height="16" fill="white"/><text x="556" y="458" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">records</text><path d="M660 345H700V137" fill="none" stroke="#315c91" stroke-width="1.4"/><path d="M700 345V622" fill="none" stroke="#315c91" stroke-width="1.4"/><path d="M700 137H738" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><path d="M700 260H738" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><path d="M700 380H738" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><path d="M700 500H738" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><path d="M700 622H738" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="683" y="555" width="35" height="16" fill="white"/><text x="700" y="568" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">owns</text><path d="M660 405H680V900H1070V135" fill="none" stroke="#315c91" stroke-width="1.4"/><path d="M1070 135H1098" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><path d="M1070 250H1098" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><path d="M1070 365H1098" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><path d="M1070 480H1098" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><path d="M1070 595H1098" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><path d="M1070 705H1098" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><path d="M1070 822H1098" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="703" y="879" width="355" height="16" fill="white"/><text x="880" y="892" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">owns; opt-in groups only when the project registers them</text><path d="M660 280H685V74H1635V213" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="994" y="66" width="312" height="16" fill="white"/><text x="1150" y="79" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">owns through the interface; registers every route</text><path d="M1240 775V747" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1245" y="752" width="90" height="16" fill="white"/><text x="1290" y="765" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">registered in</text><path d="M1380 822H1415V595H1382" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1395" y="687" width="41" height="16" fill="white"/><text x="1415" y="700" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">lease</text><path d="M1635 305V353" fill="none" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="1648" y="321" width="72" height="16" fill="white"/><text x="1684" y="334" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">implements</text><path d="M1635 450V508" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1650" y="471" width="35" height="16" fill="white"/><text x="1667" y="484" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">uses</text><path d="M1635 585V628" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1650" y="599" width="35" height="16" fill="white"/><text x="1667" y="612" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">uses</text><path d="M1635 705V748" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1650" y="719" width="35" height="16" fill="white"/><text x="1667" y="732" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">uses</text><text x="30" y="938" text-anchor="start" font-size="13" font-weight="400" fill="#172033">Default: handlers run on the connection's server thread, which stays blocked until the response is sent. A dispatcher adds safe handoff, not extra capacity.</text></g></svg>
