<svg xmlns="http://www.w3.org/2000/svg" width="1466" height="1087" viewBox="0 0 1466 1087"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">deploy family: stage, activate and roll back (separately approved in R6)</text><text x="20" y="56" font-size="14">Agreed gigante::restcore architecture. Implemented through R1; items marked R2 or R6 are planned.</text><rect x="706" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="730" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="856" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="880" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1006" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1030" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1156" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1180" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1306" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1330" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><path d="M118 128V1077" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="22" y="78" width="192" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="118" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Remote client</text><path d="M323 128V1077" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="323" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpTransport</text><text x="323" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">(CppHttplibTransport)</text><path d="M528 128V1077" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="528" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">MiddlewareChain</text><path d="M733 128V1077" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="733" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">DeployService</text><path d="M938 128V1077" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="938" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">CopyService</text><path d="M1143 128V1077" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1047" y="78" width="192" height="50" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1143" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Deploy provider</text><text x="1143" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">(project)</text><path d="M1348 128V1077" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1252" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1348" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">RestMetrics</text><rect x="8" y="142" width="1450" height="24" fill="#eef2ff"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Off by default: without GIGANTE_REST_ENABLE_DEPLOY, these routes do not exist (404)</text><rect x="8" y="178" width="1450" height="24" fill="#eef2ff"/><text x="16" y="195" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Never on iOS or store Android artifacts. The engine never executes a payload</text><rect x="8" y="214" width="1450" height="24" fill="#e7f6ec"/><text x="16" y="231" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Stage</text><path d="M118 266H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="412" y="244" width="232" height="17" fill="white"/><text x="528.0" y="258" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">copy* transfers completed earlier</text><path d="M118 297H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="84" y="275" width="272" height="17" fill="white"/><text x="220.5" y="289" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">POST deployStage(manifest, transferIds)</text><path d="M323 328H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="316" y="306" width="218" height="17" fill="white"/><text x="425.5" y="320" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">authenticate; deploy permission</text><path d="M528 359H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="589" y="337" width="84" height="17" fill="white"/><text x="630.5" y="351" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">deployStage</text><path d="M733 390h30v20h-28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="767" y="382" width="259" height="17" fill="white"/><text x="771" y="396" text-anchor="start" font-size="12" font-weight="400" fill="#172033">production: verify manifest signature</text><path d="M733 440H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="733" y="418" width="205" height="17" fill="white"/><text x="835.5" y="432" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">confirm transfers and digests</text><path d="M733 471h30v20h-28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="767" y="463" width="292" height="17" fill="white"/><text x="771" y="477" text-anchor="start" font-size="12" font-weight="400" fill="#172033">preflight: architecture, ABI, dependencies</text><path d="M733 521H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="397" y="499" width="57" height="17" fill="white"/><text x="425.5" y="513" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stageId</text><rect x="8" y="536" width="1450" height="24" fill="#e7f6ec"/><text x="16" y="553" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Activate</text><path d="M118 588H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="121" y="566" width="198" height="17" fill="white"/><text x="220.5" y="580" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">POST deployActivate(stageId)</text><path d="M733 619H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="380" y="597" width="91" height="17" fill="white"/><text x="425.5" y="611" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">202 Accepted</text><path d="M733 650H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="876" y="628" width="124" height="17" fill="white"/><text x="938.0" y="642" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">activate callback</text><path d="M1143 681H735" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="903" y="659" width="70" height="17" fill="white"/><text x="938.0" y="673" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">activated</text><path d="M118 712H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="380" y="690" width="91" height="17" fill="white"/><text x="425.5" y="704" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">deployStatus</text><path d="M733 743H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="390" y="721" width="70" height="17" fill="white"/><text x="425.5" y="735" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">activated</text><rect x="8" y="758" width="1450" height="24" fill="#eef2ff"/><text x="16" y="775" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Explicit rollback</text><path d="M118 810H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="343" y="788" width="165" height="17" fill="white"/><text x="425.5" y="802" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">deployRollback(stageId)</text><path d="M733 841H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="876" y="819" width="124" height="17" fill="white"/><text x="938.0" y="833" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">rollback callback</text><rect x="8" y="856" width="1450" height="24" fill="#fdecea"/><text x="16" y="873" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Failure paths</text><path d="M733 908H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="259" y="886" width="333" height="17" fill="white"/><text x="425.5" y="900" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">bad signature or digest: refused, nothing staged</text><path d="M733 939H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="276" y="917" width="299" height="17" fill="white"/><text x="425.5" y="931" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">incompatible payload: refused before commit</text><path d="M1143 970H735" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="886" y="948" width="104" height="17" fill="white"/><text x="938.0" y="962" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">activate fails</text><path d="M733 1001H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="876" y="979" width="124" height="17" fill="white"/><text x="938.0" y="993" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">rollback callback</text><path d="M733 1032H1346" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="915" y="1010" width="252" height="17" fill="white"/><text x="1040.5" y="1024" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">status: rolled back, with safe cause</text></g></svg>
