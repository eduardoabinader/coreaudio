<svg xmlns="http://www.w3.org/2000/svg" width="1671" height="951" viewBox="0 0 1671 951"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Request flow: success and rejection points</text><text x="20" y="56" font-size="14">Agreed gigante::restcore architecture. Implemented through R1; items marked R2 or R6 are planned.</text><rect x="911" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="935" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="1061" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="1085" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1211" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1235" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1361" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1385" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1511" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1535" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><path d="M118 128V941" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="22" y="78" width="192" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="118" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Remote client</text><path d="M323 128V941" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="323" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">httplib::SSLServer</text><text x="323" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">+ ThreadPool</text><path d="M528 128V941" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="528" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpTransport</text><text x="528" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">(CppHttplibTransport)</text><path d="M733 128V941" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="733" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">MiddlewareChain</text><path d="M938 128V941" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="938" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">Router</text><path d="M1143 128V941" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1047" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1143" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HandlerDispatcher</text><text x="1143" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">(optional)</text><path d="M1348 128V941" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1252" y="78" width="192" height="50" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1348" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Project code</text><text x="1348" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">(domain handlers)</text><path d="M1553 128V941" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1457" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1553" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">RestMetrics</text><rect x="8" y="142" width="1655" height="24" fill="#e7f6ec"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Default path: handler runs on the connection's server thread, concurrently with others</text><path d="M118 194H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="118" y="172" width="205" height="17" fill="white"/><text x="220.5" y="186" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">PUT /api/v1/items/42 over TLS</text><path d="M323 225H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="320" y="203" width="212" height="17" fill="white"/><text x="425.5" y="217" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">headers read; TransportRequest</text><path d="M528 256H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="508" y="234" width="245" height="17" fill="white"/><text x="630.5" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">pre-routing: request ID, CORS, auth</text><path d="M733 287H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="743" y="265" width="185" height="17" fill="white"/><text x="835.5" y="279" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">match route; validate {id}</text><path d="M938 318H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1054" y="296" width="178" height="17" fill="white"/><text x="1143.0" y="310" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">handler with typed values</text><path d="M1348 349H530" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="873" y="327" width="131" height="17" fill="white"/><text x="938.0" y="341" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">result; serialized</text><path d="M528 380H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="264" y="358" width="118" height="17" fill="white"/><text x="323.0" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">200 + request ID</text><path d="M528 411H1551" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="988" y="389" width="104" height="17" fill="white"/><text x="1040.5" y="403" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">count, latency</text><rect x="8" y="426" width="1655" height="24" fill="#eef2ff"/><text x="16" y="443" text-anchor="start" font-size="13" font-weight="700" fill="#172033">With an injected dispatcher: the server thread waits with a deadline</text><path d="M938 478H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1015" y="456" width="50" height="17" fill="white"/><text x="1040.5" y="470" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">submit</text><path d="M1143 509H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1140" y="487" width="212" height="17" fill="white"/><text x="1245.5" y="501" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">handler on a Qt or JUCE thread</text><path d="M1348 540H1145" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="1220" y="518" width="50" height="17" fill="white"/><text x="1245.5" y="532" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">result</text><path d="M1143 571H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="538" y="549" width="185" height="17" fill="white"/><text x="630.5" y="563" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">queue full: 503, retryable</text><path d="M1143 602H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="461" y="580" width="339" height="17" fill="white"/><text x="630.5" y="594" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">deadline missed: 504; a later result is discarded</text><rect x="8" y="617" width="1655" height="24" fill="#fdecea"/><text x="16" y="634" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Rejected before the body is read</text><path d="M733 669H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="316" y="647" width="218" height="17" fill="white"/><text x="425.5" y="661" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">401: missing or bad credentials</text><path d="M733 700H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="289" y="678" width="272" height="17" fill="white"/><text x="425.5" y="692" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">413: declared size over the route limit</text><rect x="8" y="715" width="1655" height="24" fill="#fdecea"/><text x="16" y="732" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Rejected by route, or failed in a handler</text><path d="M938 767H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="422" y="745" width="212" height="17" fill="white"/><text x="528.0" y="759" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">404 or 405: no route or method</text><path d="M938 798H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="358" y="776" width="339" height="17" fill="white"/><text x="528.0" y="790" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">400: {id} has %00, .. or %2F, or fails validation</text><path d="M1348 829H530" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="886" y="807" width="104" height="17" fill="white"/><text x="938.0" y="821" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">handler throws</text><path d="M528 860H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="153" y="838" width="339" height="17" fill="white"/><text x="323.0" y="852" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">500: structured error; exception text not exposed</text><rect x="8" y="875" width="1655" height="24" fill="#eef2ff"/><text x="16" y="892" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Long work must not block: start it, reply 202, and report through status</text></g></svg>
