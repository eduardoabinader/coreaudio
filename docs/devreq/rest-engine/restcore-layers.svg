<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="800" viewBox="0 0 1840 800"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">restcore: layers and dependency direction</text><text x="20" y="56" font-size="14">Agreed gigante::restcore architecture. Implemented through R1; items marked R2 or R6 are planned.</text><rect x="1080" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1104" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="1230" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="1254" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1380" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1404" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1530" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1554" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1680" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1704" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><rect x="10" y="78" width="1820" height="88" rx="8" fill="#ecfdf5" stroke="#cbd5e1"/><text x="92" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">Consuming</text><text x="92" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">project</text><rect x="184.0" y="86" width="360.0" height="72" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="364.0" y="108" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">Domain handlers</text><text x="364.0" y="128" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">Kuaru, AHIO, gst-harness</text><text x="364.0" y="145" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">own routes and meaning</text><rect x="554.0" y="86" width="360.0" height="72" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="734.0" y="108" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">Project providers</text><text x="734.0" y="128" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">health checks, service callbacks,</text><text x="734.0" y="145" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">resources, stream data</text><rect x="924.0" y="86" width="360.0" height="72" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1104.0" y="108" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">Logger context</text><text x="1104.0" y="128" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">injected gigante::Logger</text><rect x="1294.0" y="86" width="360.0" height="72" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1474.0" y="108" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">Dispatcher (optional)</text><text x="1474.0" y="128" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">hands work to a Qt or</text><text x="1474.0" y="145" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">JUCE thread</text><path d="M1780 166V175" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="10" y="176" width="1820" height="88" rx="8" fill="#f5f3ff" stroke="#cbd5e1"/><text x="92" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">Public C++ API</text><rect x="184.0" y="184" width="483.3333333333333" height="72" rx="7" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="425.66666666666663" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">gigante::RestServer</text><text x="425.66666666666663" y="226" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">lifecycle and route registration</text><rect x="677.3333333333333" y="184" width="483.3333333333333" height="72" rx="7" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="918.9999999999999" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">gigante::RestClient</text><text x="918.9999999999999" y="226" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">typed calls, retries, cancel</text><rect x="1170.6666666666665" y="184" width="483.3333333333333" height="72" rx="7" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="1412.3333333333333" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">RestRequest, RestResponse, RestConfig</text><text x="1412.3333333333333" y="226" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">plain values; no library types</text><path d="M1780 264V273" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="10" y="274" width="1820" height="88" rx="8" fill="#eff6ff" stroke="#cbd5e1"/><text x="92" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">Engine</text><rect x="184.0" y="282" width="286.0" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="327.0" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">Router</text><text x="327.0" y="324" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">{id}, validation,</text><text x="327.0" y="341" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">reserved prefix</text><rect x="480.0" y="282" width="286.0" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="623.0" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">MiddlewareChain</text><text x="623.0" y="324" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">request IDs, CORS,</text><text x="623.0" y="341" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">auth before body read</text><rect x="776.0" y="282" width="286.0" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="919.0" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">SecurityPolicy</text><text x="919.0" y="324" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">HTTP and HTTPS rules</text><rect x="1072.0" y="282" width="286.0" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1215.0" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">HandlerDispatcher</text><text x="1215.0" y="324" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">optional interface</text><rect x="1368.0" y="282" width="286.0" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1511.0" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">RestMetrics</text><text x="1511.0" y="324" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">counters snapshot</text><path d="M1780 362V371" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="10" y="372" width="1820" height="88" rx="8" fill="#eff6ff" stroke="#cbd5e1"/><text x="92" y="407" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">Common</text><text x="92" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">endpoints</text><rect x="184.0" y="380" width="286.0" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="327.0" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">CommonEndpoints</text><text x="327.0" y="422" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">always on: health, heartbeat,</text><text x="327.0" y="439" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">status, version, capabilities</text><rect x="480.0" y="380" width="286.0" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="623.0" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">ServiceRegistry</text><text x="623.0" y="422" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">opt-in: startService,</text><text x="623.0" y="439" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stopService, restartService</text><rect x="776.0" y="380" width="286.0" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="919.0" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">CopyService</text><text x="919.0" y="422" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">opt-in, R2: copy*</text><rect x="1072.0" y="380" width="286.0" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1215.0" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">DiagnosticsEndpoints</text><text x="1215.0" y="422" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">opt-in, R2: getLog,</text><text x="1215.0" y="439" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">cmdStatus, appendLogMarker</text><rect x="1368.0" y="380" width="286.0" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1511.0" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">DeployService</text><text x="1511.0" y="422" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">R6: build flag, off</text><text x="1511.0" y="439" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">by default</text><path d="M1780 460V469" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="10" y="470" width="1820" height="88" rx="8" fill="#eff6ff" stroke="#cbd5e1"/><text x="92" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">Streaming</text><text x="92" y="522" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">and limits</text><rect x="184.0" y="478" width="483.3333333333333" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="425.66666666666663" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">CapacityGate</text><text x="425.66666666666663" y="520" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stream and transfer caps,</text><text x="425.66666666666663" y="537" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">RAII leases</text><rect x="677.3333333333333" y="478" width="483.3333333333333" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="918.9999999999999" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">StreamHub</text><text x="918.9999999999999" y="520" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">opt-in, R2: declared streams</text><rect x="1170.6666666666665" y="478" width="483.3333333333333" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1412.3333333333333" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">StreamSession</text><text x="1412.3333333333333" y="520" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">one subscriber, bounded,</text><text x="1412.3333333333333" y="537" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">DeliveryPolicy</text><path d="M1780 558V567" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="10" y="568" width="1820" height="88" rx="8" fill="#eff6ff" stroke="#cbd5e1"/><text x="92" y="610" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">Engine boundary</text><rect x="184.0" y="576" width="360.0" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="364.0" y="598" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">HttpTransport</text><text x="364.0" y="618" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">interface; no library types</text><rect x="554.0" y="576" width="360.0" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="734.0" y="598" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">CppHttplibTransport</text><text x="734.0" y="618" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">only server code that</text><text x="734.0" y="635" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">includes httplib.h</text><rect x="924.0" y="576" width="360.0" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1104.0" y="598" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">HttpClientTransport</text><text x="1104.0" y="618" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">interface; no library types</text><rect x="1294.0" y="576" width="360.0" height="72" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1474.0" y="598" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">CppHttplibClientTransport</text><text x="1474.0" y="618" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">only client code that</text><text x="1474.0" y="635" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">includes httplib.h</text><path d="M1780 656V665" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="10" y="666" width="1820" height="88" rx="8" fill="#fffbeb" stroke="#cbd5e1"/><text x="92" y="708" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">Libraries</text><rect x="184.0" y="674" width="483.3333333333333" height="72" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="425.66666666666663" y="696" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">httplib::Server, SSLServer</text><text x="425.66666666666663" y="716" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">ThreadPool, DataSink</text><rect x="677.3333333333333" y="674" width="483.3333333333333" height="72" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="918.9999999999999" y="696" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">httplib::Client, SSEClient</text><text x="918.9999999999999" y="716" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">verification on by default</text><rect x="1170.6666666666665" y="674" width="483.3333333333333" height="72" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1412.3333333333333" y="696" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">OpenSSL 3.x or Mbed TLS 3.6.7+</text><text x="1412.3333333333333" y="716" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">chosen at build time</text><text x="20" y="782" text-anchor="start" font-size="13" font-weight="400" fill="#172033">Arrows show dependency direction: each layer depends only on the layers below it, and the libraries never see project types.</text></g></svg>
