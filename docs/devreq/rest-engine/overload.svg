<svg xmlns="http://www.w3.org/2000/svg" width="1466" height="927" viewBox="0 0 1466 927"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Overload: rejection, reserved capacity and slow clients</text><text x="20" y="56" font-size="14">Agreed gigante::restcore architecture. Implemented through R1; items marked R2 or R6 are planned.</text><rect x="706" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="730" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="856" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="880" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1006" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1030" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1156" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1180" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1306" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1330" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><path d="M118 128V917" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="22" y="78" width="192" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="118" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Remote client</text><path d="M323 128V917" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="323" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">httplib::SSLServer</text><text x="323" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">+ ThreadPool</text><path d="M528 128V917" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="528" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpTransport</text><text x="528" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">(CppHttplibTransport)</text><path d="M733 128V917" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="733" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">MiddlewareChain</text><path d="M938 128V917" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="938" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">CapacityGate</text><path d="M1143 128V917" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1047" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1143" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">CommonEndpoints</text><path d="M1348 128V917" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1252" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1348" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">RestMetrics</text><rect x="8" y="142" width="1450" height="24" fill="#eef2ff"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Sizing: pool threads = stream cap + transfer cap + reserve, for up to 100 clients</text><rect x="8" y="178" width="1450" height="24" fill="#fdecea"/><text x="16" y="195" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Stream or transfer over its cap: 503, so it cannot hold a thread for long</text><path d="M118 230H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="115" y="208" width="212" height="17" fill="white"/><text x="220.5" y="222" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET /core/v1/streams/{id}/live</text><path d="M323 261H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="347" y="239" width="158" height="17" fill="white"/><text x="425.5" y="253" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">route on a pool thread</text><path d="M528 292H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="668" y="270" width="131" height="17" fill="white"/><text x="733.0" y="284" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">tryAcquireStream()</text><path d="M938 323H1346" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="1098" y="301" width="91" height="17" fill="white"/><text x="1143.0" y="315" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">rejected + 1</text><path d="M528 354H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="217" y="332" width="212" height="17" fill="white"/><text x="323.0" y="346" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">503 retryable; thread returned</text><rect x="8" y="369" width="1450" height="24" fill="#e7f6ec"/><text x="16" y="386" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Caps reached by streams and transfers: health and status still answer</text><path d="M118 421H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="152" y="399" width="138" height="17" fill="white"/><text x="220.5" y="413" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET /core/v1/health</text><path d="M323 452H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="661" y="430" width="144" height="17" fill="white"/><text x="733.0" y="444" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">free reserved thread</text><path d="M1143 483H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="531" y="461" width="198" height="17" fill="white"/><text x="630.5" y="475" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">200 within the latency limit</text><rect x="8" y="498" width="1450" height="24" fill="#fdecea"/><text x="16" y="515" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Known gap (R0): idle connections take threads at accept, so the reserve does not protect here</text><path d="M118 550H321" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="78" y="528" width="286" height="17" fill="white"/><text x="220.5" y="542" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">many idle connections fill pool and queue</text><path d="M323 581H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="81" y="559" width="279" height="17" fill="white"/><text x="220.5" y="573" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">new connections closed, including health</text><path d="M323 612H1346" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="723" y="590" width="225" height="17" fill="white"/><text x="835.5" y="604" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">error logger: ResourceExhaustion</text><path d="M323 643h30v20h-28" fill="none" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="357" y="635" width="380" height="17" fill="white"/><text x="361" y="649" text-anchor="start" font-size="12" font-weight="400" fill="#b42318">read timeout clears them: trusted networks only for now</text><rect x="8" y="677" width="1450" height="24" fill="#fdecea"/><text x="16" y="694" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Slow or idle client</text><path d="M118 729H321" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="172" y="707" width="97" height="17" fill="white"/><text x="220.5" y="721" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">stops reading</text><path d="M323 760h30v20h-28" fill="none" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="357" y="752" width="400" height="17" fill="white"/><text x="361" y="766" text-anchor="start" font-size="12" font-weight="400" fill="#b42318">write timeout closes it; TLS can take several times longer</text><path d="M118 810H321" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="115" y="788" width="212" height="17" fill="white"/><text x="220.5" y="802" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">large body, one byte at a time</text><path d="M733 841H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="273" y="819" width="306" height="17" fill="white"/><text x="425.5" y="833" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">unauthenticated: 401 before any body is read</text><path d="M528 872H1346" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="762" y="850" width="353" height="17" fill="white"/><text x="938.0" y="864" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">authenticated: total body deadline; count and close</text></g></svg>
