<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="600" viewBox="0 0 1640 600"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">R2 client: subscriptions and transfers</text><text x="20" y="56" font-size="14">Proposed R2 design, for approval. Built on R1 (implemented); nothing in R2 is implemented yet.</text><rect x="880" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="904" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="1030" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="1054" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1180" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1204" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1330" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1354" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1480" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1504" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><rect x="30" y="110" width="270" height="95" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="165.0" y="132" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">Project code</text><text x="165.0" y="152" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">event callback, chunk source</text><text x="165.0" y="169" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">and sink</text><rect x="30" y="300" width="270" height="150" rx="7" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="165.0" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">gigante::RestClient</text><text x="165.0" y="342" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">R1 class, extended:</text><text x="165.0" y="359" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">subscribe, listResources,</text><text x="165.0" y="376" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">upload, download, getLog,</text><text x="165.0" y="393" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">cmdStatus, appendLogMarker</text><rect x="390" y="90" width="290" height="100" rx="7" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="535.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">RestSubscription</text><text x="535.0" y="132" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">RAII handle from subscribe</text><text x="535.0" y="149" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">cancel on destroy; no callback after</text><rect x="390" y="240" width="290" height="100" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="535.0" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">StreamSubscription</text><text x="535.0" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">reconnect limit and minimum</text><text x="535.0" y="299" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">interval, even with retry:0</text><rect x="390" y="390" width="290" height="110" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="535.0" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">TransferClient</text><text x="535.0" y="432" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">streamed upload and download,</text><text x="535.0" y="449" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">resume from copyStatus or Range,</text><text x="535.0" y="466" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">progress, digest</text><rect x="780" y="390" width="230" height="80" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="895.0" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">Sha256</text><text x="895.0" y="432" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">shared with the server</text><rect x="780" y="240" width="280" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="920.0" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">HttpClientTransport</text><text x="920.0" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">R1 interface</text><rect x="1150" y="240" width="440" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1370.0" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">CppHttplibClientTransport</text><text x="1370.0" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">only client code including httplib.h</text><text x="1370.0" y="299" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">SSEClient and streamed Get and Put</text><rect x="1150" y="400" width="440" height="75" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1370.0" y="422" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">httplib::Client, SSEClient</text><text x="1370.0" y="442" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stop() cancels</text><path d="M165 205V298" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="177" y="239" width="41" height="16" fill="white"/><text x="197" y="252" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">calls</text><path d="M300 330H345V140H388" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="318" y="207" width="53" height="16" fill="white"/><text x="345" y="220" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">returns</text><path d="M535 190V238" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="549" y="201" width="35" height="16" fill="white"/><text x="566" y="214" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">owns</text><path d="M300 420H388" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="327" y="399" width="35" height="16" fill="white"/><text x="344" y="412" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">owns</text><path d="M680 290H778" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="696" y="269" width="65" height="16" fill="white"/><text x="729" y="282" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">opens via</text><path d="M680 430H730V315H778" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="697" y="362" width="65" height="16" fill="white"/><text x="730" y="375" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">sends via</text><path d="M680 470H778" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="687" y="449" width="84" height="16" fill="white"/><text x="729" y="462" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">digests with</text><path d="M1060 288H1148" fill="none" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="1056" y="217" width="96" height="16" fill="white"/><text x="1104" y="230" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">implemented by</text><path d="M1370 335V398" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1385" y="355" width="35" height="16" fill="white"/><text x="1402" y="368" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">uses</text></g></svg>
