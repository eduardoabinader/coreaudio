<svg xmlns="http://www.w3.org/2000/svg" width="1671" height="972" viewBox="0 0 1671 972"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Shutdown: ordered drain, stuck work and independent instances</text><text x="20" y="56" font-size="14">Agreed gigante::restcore architecture. Implemented through R1; items marked R2 or R6 are planned.</text><rect x="911" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="935" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="1061" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="1085" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1211" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1235" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1361" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1385" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1511" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1535" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><path d="M118 128V962" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="22" y="78" width="192" height="50" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="118" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Project host</text><path d="M323 128V962" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="323" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">gigante::RestServer</text><path d="M528 128V962" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="528" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">CapacityGate</text><path d="M733 128V962" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="733" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">StreamHub</text><path d="M938 128V962" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="938" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">StreamSession</text><text x="938" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">+ DeliveryPolicy</text><path d="M1143 128V962" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1047" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1143" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HandlerDispatcher</text><text x="1143" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">(optional)</text><path d="M1348 128V962" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1252" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1348" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpTransport</text><text x="1348" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">(CppHttplibTransport)</text><path d="M1553 128V962" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1457" y="78" width="192" height="50" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1553" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">httplib::SSLServer</text><text x="1553" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">+ ThreadPool</text><rect x="8" y="142" width="1655" height="24" fill="#e7f6ec"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Ordered stop</text><path d="M118 194H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="195" y="172" width="50" height="17" fill="white"/><text x="220.5" y="186" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stop()</text><path d="M323 225h30v20h-28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="357" y="217" width="111" height="17" fill="white"/><text x="361" y="231" text-anchor="start" font-size="12" font-weight="400" fill="#172033">state: draining</text><path d="M323 275H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="363" y="253" width="124" height="17" fill="white"/><text x="425.5" y="267" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">refuse new leases</text><path d="M323 306H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="486" y="284" width="84" height="17" fill="white"/><text x="528.0" y="298" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">cancelAll()</text><path d="M733 337H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="787" y="315" width="97" height="17" fill="white"/><text x="835.5" y="329" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">set cancelled</text><path d="M938 368H1551" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="1133" y="346" width="225" height="17" fill="white"/><text x="1245.5" y="360" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">next provider call returns false</text><path d="M938 399H530" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="681" y="377" width="104" height="17" fill="white"/><text x="733.0" y="391" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">lease released</text><path d="M323 430H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="557" y="408" width="353" height="17" fill="white"/><text x="733.0" y="422" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">if injected: refuse new work; waiting calls get 503</text><path d="M323 461H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="817" y="439" width="37" height="17" fill="white"/><text x="835.5" y="453" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stop</text><path d="M1348 492H1551" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1355" y="470" width="191" height="17" fill="white"/><text x="1450.5" y="484" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stop(): closes the listener</text><path d="M1553 523h-30v20h28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><text x="1515" y="529" text-anchor="end" font-size="12" font-weight="400" fill="#172033">listen thread: pool shutdown, join</text><path d="M1348 573H325" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="810" y="551" width="50" height="17" fill="white"/><text x="835.5" y="565" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">joined</text><path d="M323 604H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="121" y="582" width="198" height="17" fill="white"/><text x="220.5" y="596" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stopped; repeat stop is safe</text><rect x="8" y="619" width="1655" height="24" fill="#fdecea"/><text x="16" y="636" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Stuck work: cpp-httplib's join has no limit, so the server must signal first</text><path d="M1553 671H940" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="1113" y="649" width="265" height="17" fill="white"/><text x="1245.5" y="663" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">writer stalled until the write timeout</text><path d="M1553 702H325" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="812" y="680" width="252" height="17" fill="white"/><text x="938.0" y="694" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">handler still running past the bound</text><path d="M323 733H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="71" y="711" width="299" height="17" fill="white"/><text x="220.5" y="725" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">stop reports a timeout naming what is stuck</text><path d="M323 764h30v20h-28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="357" y="756" width="440" height="17" fill="white"/><text x="361" y="770" text-anchor="start" font-size="12" font-weight="400" fill="#172033">destroy blocks until callbacks end: no callback after it returns</text><rect x="8" y="798" width="1655" height="24" fill="#e7f6ec"/><text x="16" y="815" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Two instances: different certificates; stopping one leaves the other serving</text><path d="M118 850H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="148" y="828" width="144" height="17" fill="white"/><text x="220.5" y="842" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stop instance A only</text><path d="M323 881H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="145" y="859" width="151" height="17" fill="white"/><text x="220.5" y="873" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">instance B unaffected</text><rect x="8" y="896" width="1655" height="24" fill="#eef2ff"/><text x="16" y="913" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Mobile suspension uses the same stop, then an explicit restart. No background promise</text></g></svg>
