<svg xmlns="http://www.w3.org/2000/svg" width="1671" height="1060" viewBox="0 0 1671 1060"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Subscription, server side: admission, delivery, end and stop</text><text x="20" y="56" font-size="14">Proposed R2 design, for approval. Built on R1 (implemented); nothing in R2 is implemented yet.</text><rect x="911" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="935" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="1061" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="1085" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1211" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1235" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1361" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1385" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1511" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1535" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><path d="M118 128V1050" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="22" y="78" width="192" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="118" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Remote client</text><path d="M323 128V1050" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="323" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpTransport</text><text x="323" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">(CppHttplibTransport)</text><path d="M528 128V1050" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="528" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">Router +</text><text x="528" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">MiddlewareChain</text><path d="M733 128V1050" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="733" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">CapacityGate</text><path d="M938 128V1050" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="938" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">StreamHub</text><path d="M1143 128V1050" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1047" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1143" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">StreamSession</text><path d="M1348 128V1050" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1252" y="78" width="192" height="50" rx="6" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="1348" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">RestStream</text><path d="M1553 128V1050" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1457" y="78" width="192" height="50" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1553" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Project producer</text><rect x="8" y="142" width="1655" height="24" fill="#e7f6ec"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Admission: cheapest checks first, before a thread is held for streaming</text><path d="M118 194H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="115" y="172" width="212" height="17" fill="white"/><text x="220.5" y="186" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET /core/v1/streams/{id}/live</text><path d="M323 225H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="326" y="203" width="198" height="17" fill="white"/><text x="425.5" y="217" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">route lookup, authentication</text><path d="M528 256H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="254" y="234" width="138" height="17" fill="white"/><text x="323.0" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">401 unauthenticated</text><path d="M528 287H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="674" y="265" width="118" height="17" fill="white"/><text x="733.0" y="279" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stream declared?</text><path d="M938 318H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="463" y="296" width="131" height="17" fill="white"/><text x="528.0" y="310" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">404 unknown stream</text><path d="M528 349H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="565" y="327" width="131" height="17" fill="white"/><text x="630.5" y="341" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">tryAcquireStream()</text><path d="M733 380H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="333" y="358" width="185" height="17" fill="white"/><text x="425.5" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">503 cap reached, retryable</text><path d="M733 411H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="814" y="389" width="44" height="17" fill="white"/><text x="835.5" y="403" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">lease</text><path d="M938 442H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="894" y="420" width="292" height="17" fill="white"/><text x="1040.5" y="434" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">create: policy, queue limit, Last-Event-ID</text><path d="M1143 473H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="454" y="451" width="353" height="17" fill="white"/><text x="630.5" y="465" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">200 text/event-stream; gap event if ids were missed</text><rect x="8" y="488" width="1655" height="24" fill="#e7f6ec"/><text x="16" y="505" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Delivery</text><path d="M1553 540H1350" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1388" y="518" width="124" height="17" fill="white"/><text x="1450.5" y="532" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">tryPublish(bytes)</text><path d="M1348 571H940" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1027" y="549" width="232" height="17" fill="white"/><text x="1143.0" y="563" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">publish: assign the next event id</text><path d="M938 602H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1012" y="580" width="57" height="17" fill="white"/><text x="1040.5" y="594" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">enqueue</text><path d="M1143 633H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="572" y="611" width="118" height="17" fill="white"/><text x="630.5" y="625" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">id: n, data: ...</text><path d="M1143 664h30v20h-28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1177" y="656" width="165" height="17" fill="white"/><text x="1181" y="670" text-anchor="start" font-size="12" font-weight="400" fill="#172033">idle: heartbeat comment</text><rect x="8" y="700" width="1655" height="24" fill="#eef2ff"/><text x="16" y="717" text-anchor="start" font-size="13" font-weight="700" fill="#172033">The producer ends the stream</text><path d="M1553 752H1350" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1422" y="730" width="57" height="17" fill="white"/><text x="1450.5" y="744" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">close()</text><path d="M1348 783H940" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1074" y="761" width="138" height="17" fill="white"/><text x="1143.0" y="775" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">end all subscribers</text><path d="M1143 814H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="555" y="792" width="151" height="17" fill="white"/><text x="630.5" y="806" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">end event, then close</text><path d="M1143 845H735" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="886" y="823" width="104" height="17" fill="white"/><text x="938.0" y="837" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">lease released</text><path d="M1348 876H1551" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="1365" y="854" width="171" height="17" fill="white"/><text x="1450.5" y="868" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">later tryPublish: closed</text><rect x="8" y="891" width="1655" height="24" fill="#eef2ff"/><text x="16" y="908" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Server stop</text><path d="M938 943H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="999" y="921" width="84" height="17" fill="white"/><text x="1040.5" y="935" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">cancelAll()</text><path d="M1143 974H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="468" y="952" width="326" height="17" fill="white"/><text x="630.5" y="966" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">connection closed; client sees 503 on reconnect</text><path d="M1143 1005H735" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="772" y="983" width="333" height="17" fill="white"/><text x="938.0" y="997" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">lease released; no producer callback is involved</text></g></svg>
