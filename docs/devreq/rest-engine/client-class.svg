<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">restcore client: class collaborations</text><text x="20" y="56" font-size="14">Agreed gigante::restcore architecture. Implemented through R1; items marked R2 or R6 are planned.</text><rect x="840" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="864" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="990" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="1014" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1140" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1164" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1290" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1314" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1440" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1464" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><rect x="30" y="110" width="270" height="90" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="165.0" y="132" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">Project code</text><text x="165.0" y="152" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">calls typed methods</text><text x="165.0" y="169" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">never builds HTTP by hand</text><rect x="30" y="300" width="270" height="170" rx="7" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="165.0" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">gigante::RestClient</text><text x="165.0" y="342" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">typed common calls and IDs</text><text x="165.0" y="359" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">deadlines and cancellation</text><text x="165.0" y="376" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">retries only idempotent routes</text><text x="165.0" y="393" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">bounded asynchronous calls</text><rect x="390" y="90" width="290" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="535.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">SecurityPolicy</text><text x="535.0" y="132" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">refuses http:// in production</text><text x="535.0" y="149" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">verification on; off refused</text><rect x="390" y="225" width="290" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="535.0" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">StreamSubscription</text><text x="535.0" y="267" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">opt-in, R2: reconnect limit,</text><text x="535.0" y="284" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">minimum interval despite retry:0</text><rect x="390" y="360" width="290" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="535.0" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">TransferClient</text><text x="535.0" y="402" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">opt-in, R2: streamed copy*,</text><text x="535.0" y="419" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">digest, progress, resume</text><rect x="780" y="225" width="280" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="920.0" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">HttpClientTransport</text><text x="920.0" y="267" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">interface; no library types</text><rect x="1150" y="225" width="400" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1350.0" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">CppHttplibClientTransport</text><text x="1350.0" y="267" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">only client code including httplib.h</text><text x="1350.0" y="284" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">protects a client-only process from SIGPIPE</text><rect x="1150" y="360" width="400" height="70" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1350.0" y="382" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">httplib::Client, SSEClient</text><text x="1350.0" y="402" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stop() cancels</text><rect x="1150" y="470" width="400" height="65" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1350.0" y="492" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">OpenSSL 3.x or Mbed TLS 3.6.7+</text><text x="1350.0" y="512" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">chosen at build time</text><path d="M165 200V298" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="177" y="239" width="41" height="16" fill="white"/><text x="197" y="252" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">calls</text><path d="M300 385H345V137" fill="none" stroke="#315c91" stroke-width="1.4"/><path d="M345 137H388" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><path d="M345 272H388" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><path d="M345 385H388" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="328" y="207" width="35" height="16" fill="white"/><text x="345" y="220" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">owns</text><path d="M680 272H778" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="697" y="251" width="65" height="16" fill="white"/><text x="730" y="264" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">sends via</text><path d="M680 407H730V295H778" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="697" y="347" width="65" height="16" fill="white"/><text x="730" y="360" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">sends via</text><path d="M1060 272H1148" fill="none" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="1056" y="202" width="96" height="16" fill="white"/><text x="1104" y="215" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">implemented by</text><path d="M1350 320V358" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1365" y="330" width="35" height="16" fill="white"/><text x="1382" y="343" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">uses</text><path d="M1350 430V468" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1365" y="440" width="35" height="16" fill="white"/><text x="1382" y="453" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">uses</text></g></svg>
