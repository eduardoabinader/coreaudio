<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="874" viewBox="0 0 1560 874"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Diagnostics: getLog, cmdStatus and appendLogMarker</text><text x="20" y="56" font-size="14">Proposed R2 design, for approval. Built on R1 (implemented); nothing in R2 is implemented yet.</text><rect x="800" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="824" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="950" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="974" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1100" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1124" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1250" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1274" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1400" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1424" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><path d="M118 128V864" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="22" y="78" width="192" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="118" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Remote client</text><path d="M323 128V864" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="323" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">Router +</text><text x="323" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">MiddlewareChain</text><path d="M528 128V864" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="528" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">DiagnosticsEndpoints</text><path d="M733 128V864" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="733" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Project log folders</text><path d="M938 128V864" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="938" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Project command</text><text x="938" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">manager</text><rect x="8" y="142" width="1544" height="24" fill="#eef2ff"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Opt-in: each route exists only when the project registers its source</text><rect x="8" y="178" width="1544" height="24" fill="#e7f6ec"/><text x="16" y="195" text-anchor="start" font-size="13" font-weight="700" fill="#172033">getLog</text><path d="M118 230H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="27" y="208" width="386" height="17" fill="white"/><text x="220.5" y="222" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET /core/v1/getLog?file=*.log&amp;filter=ERROR&amp;maxLines=200</text><path d="M323 261H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="377" y="239" width="97" height="17" fill="white"/><text x="425.5" y="253" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">authenticated</text><path d="M528 292H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="501" y="270" width="259" height="17" fill="white"/><text x="630.5" y="284" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">list files under the registered roots</text><path d="M528 323h30v20h-28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="562" y="315" width="433" height="17" fill="white"/><text x="566" y="329" text-anchor="start" font-size="12" font-weight="400" fill="#172033">skip symlinks and non-log files; glob and plain-text match only</text><path d="M528 375H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="444" y="353" width="373" height="17" fill="white"/><text x="630.5" y="367" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">read matching lines, stop at maxLines and the byte cap</text><path d="M528 406H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="157" y="384" width="333" height="17" fill="white"/><text x="323.0" y="398" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">lines with relative file, line number, timestamp</text><rect x="8" y="421" width="1544" height="24" fill="#e7f6ec"/><text x="16" y="438" text-anchor="start" font-size="13" font-weight="700" fill="#172033">cmdStatus and appendLogMarker</text><path d="M118 473H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="95" y="451" width="252" height="17" fill="white"/><text x="220.5" y="465" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET /core/v1/cmdStatus?name=capture*</text><path d="M528 504H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="671" y="482" width="124" height="17" fill="white"/><text x="733.0" y="496" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">commandStatuses()</text><path d="M528 535H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="140" y="513" width="366" height="17" fill="white"/><text x="323.0" y="527" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">matching records: name, alive, PID, exit code, detail</text><path d="M118 566H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="41" y="544" width="359" height="17" fill="white"/><text x="220.5" y="558" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">POST /core/v1/appendLogMarker {command, event, text}</text><path d="M528 597H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="604" y="575" width="259" height="17" fill="white"/><text x="733.0" y="589" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">appendLogMarker(record), size-bounded</text><path d="M528 628H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="291" y="606" width="64" height="17" fill="white"/><text x="323.0" y="620" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">appended</text><rect x="8" y="643" width="1544" height="24" fill="#fdecea"/><text x="16" y="660" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Failure paths</text><path d="M528 695H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="123" y="673" width="400" height="17" fill="white"/><text x="323.0" y="687" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">a path, .., or an absolute name in file: 400, nothing read</text><path d="M528 726H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="163" y="704" width="319" height="17" fill="white"/><text x="323.0" y="718" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">over maxLines or the byte cap: truncated: true</text><path d="M528 757H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="231" y="735" width="185" height="17" fill="white"/><text x="323.0" y="749" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">source not registered: 404</text><path d="M938 788H530" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="678" y="766" width="111" height="17" fill="white"/><text x="733.0" y="780" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">provider throws</text><path d="M528 819H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="214" y="797" width="218" height="17" fill="white"/><text x="323.0" y="811" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">500, exception text not exposed</text></g></svg>
