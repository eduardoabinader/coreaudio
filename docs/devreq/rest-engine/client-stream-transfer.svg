<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="998" viewBox="0 0 1560 998"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Client: subscription with reconnect, and transfers with resume</text><text x="20" y="56" font-size="14">Proposed R2 design, for approval. Built on R1 (implemented); nothing in R2 is implemented yet.</text><rect x="800" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="824" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="950" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="974" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1100" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1124" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1250" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1274" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1400" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1424" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><path d="M118 128V988" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="22" y="78" width="192" height="50" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="118" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Project code</text><path d="M323 128V988" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="323" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">gigante::RestClient</text><path d="M528 128V988" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="528" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">RestSubscription</text><path d="M733 128V988" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="733" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">StreamSubscription</text><path d="M938 128V988" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="938" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">TransferClient</text><path d="M1143 128V988" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1047" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1143" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpClientTransport</text><path d="M1348 128V988" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1252" y="78" width="192" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1348" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Remote restcore</text><text x="1348" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">server</text><rect x="8" y="142" width="1544" height="24" fill="#e7f6ec"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Subscribe</text><path d="M118 194H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="91" y="172" width="259" height="17" fill="white"/><text x="220.5" y="186" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">subscribe(streamId, onEvent, options)</text><path d="M323 225H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="357" y="203" width="138" height="17" fill="white"/><text x="425.5" y="217" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">returns RAII handle</text><path d="M528 256H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="545" y="234" width="171" height="17" fill="white"/><text x="630.5" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">start on a client thread</text><path d="M733 287H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="866" y="265" width="144" height="17" fill="white"/><text x="938.0" y="279" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">open the live stream</text><path d="M1348 318H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="600" y="296" width="265" height="17" fill="white"/><text x="733.0" y="310" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">events, in order, on the client thread</text><path d="M1348 349H735" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="962" y="327" width="158" height="17" fill="white"/><text x="1040.5" y="341" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">disconnect, or retry:0</text><path d="M733 380h30v20h-28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="767" y="372" width="359" height="17" fill="white"/><text x="771" y="386" text-anchor="start" font-size="12" font-weight="400" fill="#172033">wait the minimum interval; stop at the attempt limit</text><path d="M118 432H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="254" y="410" width="138" height="17" fill="white"/><text x="323.0" y="424" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">destroy or cancel()</text><path d="M528 463H731" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="528" y="441" width="205" height="17" fill="white"/><text x="630.5" y="455" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stop; join; no callback after</text><rect x="8" y="478" width="1544" height="24" fill="#e7f6ec"/><text x="16" y="495" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Upload with resume</text><path d="M118 530H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="81" y="508" width="279" height="17" fill="white"/><text x="220.5" y="522" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">upload(resourceId, size, sha256, source)</text><path d="M323 561H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="525" y="539" width="212" height="17" fill="white"/><text x="630.5" y="553" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">copyCreate, then stream chunks</text><path d="M938 592H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="955" y="570" width="171" height="17" fill="white"/><text x="1040.5" y="584" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">PUT with X-Upload-Offset</text><path d="M1143 623H940" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="985" y="601" width="111" height="17" fill="white"/><text x="1040.5" y="615" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">connection lost</text><path d="M938 654H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="894" y="632" width="292" height="17" fill="white"/><text x="1040.5" y="646" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">copyStatus, then resume from bytesReceived</text><path d="M1348 685H940" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="1108" y="663" width="70" height="17" fill="white"/><text x="1143.0" y="677" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">committed</text><rect x="8" y="700" width="1544" height="24" fill="#e7f6ec"/><text x="16" y="717" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Download with resume</text><path d="M118 752H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="88" y="730" width="265" height="17" fill="white"/><text x="220.5" y="744" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">download(resourceId, sink, fromOffset)</text><path d="M938 783H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="988" y="761" width="104" height="17" fill="white"/><text x="1040.5" y="775" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET with Range</text><path d="M1348 814H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="577" y="792" width="312" height="17" fill="white"/><text x="733.0" y="806" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">chunks to the sink; digest checked at the end</text><rect x="8" y="829" width="1544" height="24" fill="#fdecea"/><text x="16" y="846" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Cancel</text><path d="M118 881H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="135" y="859" width="171" height="17" fill="white"/><text x="220.5" y="873" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">cancel() from any thread</text><path d="M938 912H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="904" y="890" width="272" height="17" fill="white"/><text x="1040.5" y="904" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stop(); an upload also sends copyCancel</text><path d="M323 943H120" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="189" y="921" width="64" height="17" fill="white"/><text x="220.5" y="935" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">canceled</text></g></svg>
