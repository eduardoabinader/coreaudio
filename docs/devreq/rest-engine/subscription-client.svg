<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1267" viewBox="0 0 1560 1267"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Subscription, client side: connect, reconnect, failures and cancel</text><text x="20" y="56" font-size="14">Proposed R2 design, for approval. Built on R1 (implemented); nothing in R2 is implemented yet.</text><rect x="800" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="824" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="950" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="974" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1100" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1124" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1250" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1274" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1400" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1424" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><path d="M118 128V1257" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="22" y="78" width="192" height="50" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="118" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Project code</text><path d="M323 128V1257" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="323" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">gigante::RestClient</text><path d="M528 128V1257" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="528" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">RestSubscription</text><path d="M733 128V1257" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="733" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">StreamSubscription</text><path d="M938 128V1257" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="938" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpClientTransport</text><path d="M1143 128V1257" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1047" y="78" width="192" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1143" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Remote restcore</text><text x="1143" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">server</text><rect x="8" y="142" width="1544" height="24" fill="#e7f6ec"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Normal path</text><path d="M118 194H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="58" y="172" width="326" height="17" fill="white"/><text x="220.5" y="186" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">subscribe(streamId, onEvent, onClosed, options)</text><path d="M323 225H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="357" y="203" width="138" height="17" fill="white"/><text x="425.5" y="217" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">returns RAII handle</text><path d="M528 256H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="545" y="234" width="171" height="17" fill="white"/><text x="630.5" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">start on a client thread</text><path d="M733 287H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="730" y="265" width="212" height="17" fill="white"/><text x="835.5" y="279" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET /core/v1/streams/{id}/live</text><path d="M938 318H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="952" y="296" width="178" height="17" fill="white"/><text x="1040.5" y="310" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">verified TLS, credentials</text><path d="M1143 349H735" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="846" y="327" width="185" height="17" fill="white"/><text x="938.0" y="341" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">events with id: 41, 42, 43</text><path d="M733 380H120" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="289" y="358" width="272" height="17" fill="white"/><text x="425.5" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">onEvent, in order, on the client thread</text><rect x="8" y="395" width="1544" height="24" fill="#eef2ff"/><text x="16" y="412" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Reconnect after a dropped connection</text><path d="M1143 447H735" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="883" y="425" width="111" height="17" fill="white"/><text x="938.0" y="439" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">connection lost</text><path d="M733 478h30v20h-28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="767" y="470" width="286" height="17" fill="white"/><text x="771" y="484" text-anchor="start" font-size="12" font-weight="400" fill="#172033">wait max(minimum interval, server retry:)</text><path d="M733 530H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="733" y="508" width="205" height="17" fill="white"/><text x="835.5" y="522" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">reopen with Last-Event-ID: 43</text><path d="M1143 561H735" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="802" y="539" width="272" height="17" fill="white"/><text x="938.0" y="553" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">event: gap, missed: 5 (no replay in R2)</text><path d="M733 592H120" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="273" y="570" width="306" height="17" fill="white"/><text x="425.5" y="584" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">onEvent(gap): the project decides what to do</text><rect x="8" y="607" width="1544" height="24" fill="#fdecea"/><text x="16" y="624" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Failures that do not reconnect</text><path d="M1143 659H735" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="782" y="637" width="312" height="17" fill="white"/><text x="938.0" y="651" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">401 or 404: unauthenticated or unknown stream</text><path d="M733 690H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="347" y="668" width="158" height="17" fill="white"/><text x="425.5" y="682" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">onClosed(reason), once</text><path d="M1143 721H735" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="795" y="699" width="286" height="17" fill="white"/><text x="938.0" y="713" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">end event: the producer closed the stream</text><path d="M733 752H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="330" y="730" width="191" height="17" fill="white"/><text x="425.5" y="744" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">onClosed(streamEnded), once</text><rect x="8" y="767" width="1544" height="24" fill="#fdecea"/><text x="16" y="784" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Failures that reconnect within limits</text><path d="M1143 819H735" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="819" y="797" width="238" height="17" fill="white"/><text x="938.0" y="811" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">503: stream cap or server stopping</text><path d="M733 850h30v20h-28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="767" y="842" width="245" height="17" fill="white"/><text x="771" y="856" text-anchor="start" font-size="12" font-weight="400" fill="#172033">backoff; stop after maximumAttempts</text><path d="M733 902H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="310" y="880" width="232" height="17" fill="white"/><text x="425.5" y="894" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">onClosed(attemptsExhausted), once</text><rect x="8" y="917" width="1544" height="24" fill="#fdecea"/><text x="16" y="934" text-anchor="start" font-size="13" font-weight="700" fill="#172033">A slow or throwing callback</text><path d="M733 969H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="373" y="947" width="104" height="17" fill="white"/><text x="425.5" y="961" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">onEvent blocks</text><path d="M1143 1000H735" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="768" y="978" width="339" height="17" fill="white"/><text x="938.0" y="992" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">server policy applies: drops counted, or eviction</text><path d="M118 1031H731" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="373" y="1009" width="104" height="17" fill="white"/><text x="425.5" y="1023" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">onEvent throws</text><path d="M733 1062h30v20h-28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="767" y="1054" width="238" height="17" fill="white"/><text x="771" y="1068" text-anchor="start" font-size="12" font-weight="400" fill="#172033">logged; the subscription continues</text><rect x="8" y="1098" width="1544" height="24" fill="#e7f6ec"/><text x="16" y="1115" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Cancel or destroy, from any thread</text><path d="M118 1150H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="254" y="1128" width="138" height="17" fill="white"/><text x="323.0" y="1142" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">cancel() or destroy</text><path d="M528 1181H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="481" y="1159" width="299" height="17" fill="white"/><text x="630.5" y="1173" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stop the transport; wake any reconnect wait</text><path d="M733 1212H120" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="263" y="1190" width="326" height="17" fill="white"/><text x="425.5" y="1204" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">onClosed(canceled), then no callback after join</text></g></svg>
