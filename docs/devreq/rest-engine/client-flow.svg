<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="829" viewBox="0 0 1180 829"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Client: typed call, retry, stream reconnect and cancel</text><text x="20" y="56" font-size="14">Agreed gigante::restcore architecture. Implemented through R1; items marked R2 or R6 are planned.</text><rect x="420" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="444" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="570" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="594" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="720" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="744" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="870" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="894" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1020" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1044" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><path d="M118 128V819" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="22" y="78" width="192" height="50" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="118" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Project code</text><text x="118" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">(domain handlers)</text><path d="M323 128V819" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="323" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">gigante::RestClient</text><path d="M528 128V819" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="528" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">StreamSubscription</text><path d="M733 128V819" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="733" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpClientTransport</text><text x="733" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">(CppHttplibClient...)</text><path d="M938 128V819" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="938" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Remote restcore</text><text x="938" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">server</text><rect x="8" y="142" width="1164" height="24" fill="#e7f6ec"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Typed call</text><path d="M118 194H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="121" y="172" width="198" height="17" fill="white"/><text x="220.5" y="186" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">heartbeat(), with a deadline</text><path d="M323 225H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="442" y="203" width="171" height="17" fill="white"/><text x="528.0" y="217" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">request + correlation ID</text><path d="M733 256H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="790" y="234" width="91" height="17" fill="white"/><text x="835.5" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">verified TLS</text><path d="M938 287H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="483" y="265" width="91" height="17" fill="white"/><text x="528.0" y="279" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">typed result</text><rect x="8" y="302" width="1164" height="24" fill="#fdecea"/><text x="16" y="319" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Failure and retry</text><path d="M733 354H325" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="446" y="332" width="165" height="17" fill="white"/><text x="528.0" y="346" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">503 or connection error</text><path d="M323 385h30v20h-28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="357" y="377" width="393" height="17" fill="white"/><text x="361" y="391" text-anchor="start" font-size="12" font-weight="400" fill="#172033">idempotent route: retry with backoff, within the deadline</text><path d="M323 435H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="78" y="413" width="286" height="17" fill="white"/><text x="220.5" y="427" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">otherwise: structured error, never resend</text><rect x="8" y="450" width="1164" height="24" fill="#e7f6ec"/><text x="16" y="467" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Stream subscription (R2)</text><path d="M118 502H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="227" y="480" width="191" height="17" fill="white"/><text x="323.0" y="494" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">subscribe(stream, callback)</text><path d="M528 533H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="555" y="511" width="151" height="17" fill="white"/><text x="630.5" y="525" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">open with last cursor</text><path d="M938 564H120" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="436" y="542" width="185" height="17" fill="white"/><text x="528.0" y="556" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">events, delivered in order</text><path d="M938 595H530" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="654" y="573" width="158" height="17" fill="white"/><text x="733.0" y="587" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">disconnect, or retry:0</text><path d="M528 626h30v20h-28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="562" y="618" width="292" height="17" fill="white"/><text x="566" y="632" text-anchor="start" font-size="12" font-weight="400" fill="#172033">minimum interval and attempt limit applied</text><rect x="8" y="660" width="1164" height="24" fill="#fdecea"/><text x="16" y="677" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Cancel</text><path d="M118 712H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="135" y="690" width="171" height="17" fill="white"/><text x="220.5" y="704" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">cancel() from any thread</text><path d="M323 743H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="503" y="721" width="50" height="17" fill="white"/><text x="528.0" y="735" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">stop()</text><path d="M323 774H120" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="98" y="752" width="245" height="17" fill="white"/><text x="220.5" y="766" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">canceled; no callback after destroy</text></g></svg>
