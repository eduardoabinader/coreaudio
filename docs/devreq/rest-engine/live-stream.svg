<svg xmlns="http://www.w3.org/2000/svg" width="1671" height="1086" viewBox="0 0 1671 1086"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Live stream: declare, subscribe, deliver by policy, disconnect</text><text x="20" y="56" font-size="14">Proposed R2 design, for approval. Built on R1 (implemented); nothing in R2 is implemented yet.</text><rect x="911" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="935" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="1061" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="1085" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1211" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1235" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1361" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1385" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1511" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1535" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><path d="M118 128V1076" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="22" y="78" width="192" height="50" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="118" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Project producer</text><path d="M323 128V1076" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="323" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">RestStream</text><path d="M528 128V1076" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="528" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">StreamHub</text><path d="M733 128V1076" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="733" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Remote client</text><path d="M938 128V1076" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="938" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpTransport</text><text x="938" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">(CppHttplibTransport)</text><path d="M1143 128V1076" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1047" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1143" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">CapacityGate</text><path d="M1348 128V1076" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1252" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1348" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">StreamSession</text><path d="M1553 128V1076" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1457" y="78" width="192" height="50" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1553" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">httplib::Server</text><text x="1553" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">+ ThreadPool</text><rect x="8" y="142" width="1655" height="24" fill="#eef2ff"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Declare before start()</text><path d="M118 194H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="61" y="172" width="319" height="17" fill="white"/><text x="220.5" y="186" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">declareStream(lane, format, policy, heartbeat)</text><path d="M323 225H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="357" y="203" width="138" height="17" fill="white"/><text x="425.5" y="217" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">register descriptor</text><rect x="8" y="240" width="1655" height="24" fill="#e7f6ec"/><text x="16" y="257" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Subscribe</text><path d="M733 292H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="679" y="270" width="312" height="17" fill="white"/><text x="835.5" y="284" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET /core/v1/streams/{id}/live, authenticated</text><path d="M938 323H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="975" y="301" width="131" height="17" fill="white"/><text x="1040.5" y="315" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">tryAcquireStream()</text><path d="M1143 354H940" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="992" y="332" width="97" height="17" fill="white"/><text x="1040.5" y="346" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">CapacityLease</text><path d="M938 385H530" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="698" y="363" width="70" height="17" fill="white"/><text x="733.0" y="377" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">subscribe</text><path d="M528 416H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="795" y="394" width="286" height="17" fill="white"/><text x="938.0" y="408" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">create with lease, policy and queue limit</text><path d="M1348 447H1551" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1314" y="425" width="272" height="17" fill="white"/><text x="1450.5" y="439" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">chunked provider: holds one pool thread</text><rect x="8" y="462" width="1655" height="24" fill="#e7f6ec"/><text x="16" y="479" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Deliver: the producer never blocks</text><path d="M118 514H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="158" y="492" width="124" height="17" fill="white"/><text x="220.5" y="506" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">tryPublish(bytes)</text><path d="M323 545H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="397" y="523" width="57" height="17" fill="white"/><text x="425.5" y="537" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">publish</text><path d="M528 576H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="859" y="554" width="158" height="17" fill="white"/><text x="938.0" y="568" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">enqueue a shared chunk</text><path d="M1348 607H1551" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1271" y="585" width="359" height="17" fill="white"/><text x="1450.5" y="599" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">is_writable, then write; SSE framing on the SSE lane</text><path d="M1553 638H735" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="1067" y="616" width="151" height="17" fill="white"/><text x="1143.0" y="630" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">event or binary chunk</text><path d="M1348 669h-30v20h28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><text x="1310" y="675" text-anchor="end" font-size="12" font-weight="400" fill="#172033">idle: heartbeat comment at the declared interval</text><rect x="8" y="705" width="1655" height="24" fill="#fdecea"/><text x="16" y="722" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Rejections and slow subscribers</text><path d="M1143 757H735" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="819" y="735" width="238" height="17" fill="white"/><text x="938.0" y="749" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">stream cap reached: structured 503</text><path d="M323 788H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="58" y="766" width="326" height="17" fill="white"/><text x="220.5" y="780" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">reliable and a queue full: refused, retry later</text><path d="M1348 819h30v20h-28" fill="none" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="1382" y="811" width="218" height="17" fill="white"/><text x="1386" y="825" text-anchor="start" font-size="12" font-weight="400" fill="#b42318">realtime: drop oldest, count it</text><path d="M528 871H731" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="488" y="849" width="286" height="17" fill="white"/><text x="630.5" y="863" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">broadcast: evict only the slow subscriber</text><rect x="8" y="886" width="1655" height="24" fill="#e7f6ec"/><text x="16" y="903" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Disconnect or server stop</text><path d="M733 938H1551" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1061" y="916" width="165" height="17" fill="white"/><text x="1143.0" y="930" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">close, or write timeout</text><path d="M1553 969H1350" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="1402" y="947" width="97" height="17" fill="white"/><text x="1450.5" y="961" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">releaser runs</text><path d="M1348 1000H1145" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1193" y="978" width="104" height="17" fill="white"/><text x="1245.5" y="992" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">lease released</text><path d="M1348 1031H530" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="795" y="1009" width="286" height="17" fill="white"/><text x="938.0" y="1023" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">unregister; no producer callback involved</text></g></svg>
