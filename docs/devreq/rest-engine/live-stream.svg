<svg xmlns="http://www.w3.org/2000/svg" width="1671" height="920" viewBox="0 0 1671 920"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Live stream: subscribe, deliver by policy, disconnect</text><text x="20" y="56" font-size="14">Agreed gigante::restcore architecture. Implemented through R1; items marked R2 or R6 are planned.</text><rect x="911" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="935" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="1061" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="1085" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1211" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1235" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1361" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1385" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1511" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1535" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><path d="M118 128V910" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="22" y="78" width="192" height="50" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="118" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Project providers</text><path d="M323 128V910" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="323" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">StreamHub</text><path d="M528 128V910" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="528" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Remote client</text><path d="M733 128V910" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="733" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpTransport</text><text x="733" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">(CppHttplibTransport)</text><path d="M938 128V910" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="938" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">CapacityGate</text><path d="M1143 128V910" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1047" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1143" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">StreamSession</text><text x="1143" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">+ DeliveryPolicy</text><path d="M1348 128V910" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1252" y="78" width="192" height="50" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1348" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">httplib::SSLServer</text><text x="1348" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">+ ThreadPool</text><path d="M1553 128V910" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1457" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1553" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">RestMetrics</text><rect x="8" y="142" width="1655" height="24" fill="#eef2ff"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Project declares a stream</text><path d="M118 194H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="91" y="172" width="259" height="17" fill="white"/><text x="220.5" y="186" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">declare: lane, format, cursor, policy</text><rect x="8" y="209" width="1655" height="24" fill="#e7f6ec"/><text x="16" y="226" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Subscribe</text><path d="M528 261H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="525" y="239" width="212" height="17" fill="white"/><text x="630.5" y="253" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">GET /core/v1/streams/{id}/live</text><path d="M733 292H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="770" y="270" width="131" height="17" fill="white"/><text x="835.5" y="284" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">tryAcquireStream()</text><path d="M938 323H735" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="787" y="301" width="97" height="17" fill="white"/><text x="835.5" y="315" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">CapacityLease</text><path d="M733 354H325" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="493" y="332" width="70" height="17" fill="white"/><text x="528.0" y="346" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">subscribe</text><path d="M323 385H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="634" y="363" width="198" height="17" fill="white"/><text x="733.0" y="377" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">create with lease and policy</text><path d="M1143 416H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1109" y="394" width="272" height="17" fill="white"/><text x="1245.5" y="408" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">chunked provider; holds one pool thread</text><rect x="8" y="431" width="1655" height="24" fill="#e7f6ec"/><text x="16" y="448" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Deliver: the producer never blocks</text><path d="M118 483H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="68" y="461" width="306" height="17" fill="white"/><text x="220.5" y="475" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">tryPublish(chunk) from a non-realtime thread</text><path d="M323 514H1141" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="647" y="492" width="171" height="17" fill="white"/><text x="733.0" y="506" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">enqueue in bounded queue</text><path d="M1143 545H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1163" y="523" width="165" height="17" fill="white"/><text x="1245.5" y="537" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">is_writable, then write</text><path d="M1348 576H530" stroke="#157347" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/><rect x="873" y="554" width="131" height="17" fill="white"/><text x="938.0" y="568" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">chunk or SSE event</text><rect x="8" y="591" width="1655" height="24" fill="#fdecea"/><text x="16" y="608" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Slow subscriber, by policy</text><path d="M1143 643H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="471" y="621" width="319" height="17" fill="white"/><text x="630.5" y="635" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">reliable: refused, retry later; no silent drop</text><path d="M1143 674H1551" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="1215" y="652" width="265" height="17" fill="white"/><text x="1348.0" y="666" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">realtime: drop stale data and count it</text><path d="M323 705H526" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="296" y="683" width="259" height="17" fill="white"/><text x="425.5" y="697" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">broadcast: evict only this subscriber</text><rect x="8" y="720" width="1655" height="24" fill="#e7f6ec"/><text x="16" y="737" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Disconnect</text><path d="M528 772H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="879" y="750" width="118" height="17" fill="white"/><text x="938.0" y="764" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">close connection</text><path d="M1348 803H1145" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="1153" y="781" width="185" height="17" fill="white"/><text x="1245.5" y="795" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">write fails; releaser runs</text><path d="M1143 834H940" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="988" y="812" width="104" height="17" fill="white"/><text x="1040.5" y="826" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">lease released</text><path d="M1143 865H325" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="694" y="843" width="77" height="17" fill="white"/><text x="733.0" y="857" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">unregister</text></g></svg>
