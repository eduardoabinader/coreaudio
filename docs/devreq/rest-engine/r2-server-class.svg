<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1000" viewBox="0 0 1840 1000"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">R2 server: streams, copy and diagnostics</text><text x="20" y="56" font-size="14">Proposed R2 design, for approval. Built on R1 (implemented); nothing in R2 is implemented yet.</text><rect x="1080" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1104" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="1230" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="1254" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1380" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1404" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1530" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1554" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1680" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1704" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><rect x="30" y="90" width="280" height="95" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="170.0" y="112" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">Project producer</text><text x="170.0" y="132" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">publishes from a non-audio thread</text><text x="170.0" y="149" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">bridges audio data itself (RC06)</text><rect x="30" y="225" width="280" height="110" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="170.0" y="247" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">Project resource store</text><text x="170.0" y="267" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">implements RestResourceStore</text><text x="170.0" y="284" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">owns IDs, files, retention,</text><text x="170.0" y="301" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">atomic commit</text><rect x="30" y="375" width="280" height="95" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="170.0" y="397" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">Project command manager</text><text x="170.0" y="417" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">command records and</text><text x="170.0" y="434" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">log marker writer</text><rect x="30" y="510" width="280" height="80" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="170.0" y="532" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">Project log folders</text><text x="170.0" y="552" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">roots given at registration</text><rect x="390" y="90" width="300" height="115" rx="7" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="540.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">gigante::RestServer</text><text x="540.0" y="132" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">R1 class, extended:</text><text x="540.0" y="149" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">declareStream, setResourceStore,</text><text x="540.0" y="166" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">enableLogQuery, setCommandStatus...</text><rect x="390" y="245" width="300" height="95" rx="7" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="540.0" y="267" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">RestStream</text><text x="540.0" y="287" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">handle from declareStream</text><text x="540.0" y="304" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">tryPublish(bytes): never blocks</text><rect x="390" y="380" width="300" height="95" rx="7" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="540.0" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">RestResourceStore</text><text x="540.0" y="422" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">interface: list, describe,</text><text x="540.0" y="439" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">beginUpload, openRead, freeBytes</text><rect x="390" y="515" width="300" height="90" rx="7" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="540.0" y="537" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">RestUploadSink, RestDownloadSource</text><text x="540.0" y="557" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">write, commit, discard;</text><text x="540.0" y="574" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">size, read(offset, length)</text><rect x="390" y="645" width="300" height="95" rx="7" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="540.0" y="667" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">RestStreamDescriptor and others</text><text x="540.0" y="687" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">lane, format, policy, heartbeat;</text><text x="540.0" y="704" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">transfer, log query value types</text><rect x="780" y="90" width="290" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="925.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">StreamHub</text><text x="925.0" y="132" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">R1 first version, now wired:</text><text x="925.0" y="149" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">descriptors, subscribers, cancelAll</text><rect x="780" y="225" width="290" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="925.0" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">StreamSession</text><text x="925.0" y="267" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">bounded queue, holds a lease</text><text x="925.0" y="284" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">policy, heartbeat, disconnect</text><rect x="780" y="360" width="290" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="925.0" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">CapacityGate</text><text x="925.0" y="402" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">now wired: stream and transfer caps</text><text x="925.0" y="419" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">checked against maxThreads at start</text><rect x="780" y="495" width="290" height="110" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="925.0" y="517" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">CopyService</text><text x="925.0" y="537" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">copyList, copyCreate, copyUpload,</text><text x="925.0" y="554" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">copyDownload, copyStatus, copyCancel</text><text x="925.0" y="571" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">transfer table, resume window</text><rect x="780" y="645" width="290" height="80" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="925.0" y="667" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">Sha256</text><text x="925.0" y="687" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">digest check before commit</text><rect x="780" y="765" width="290" height="110" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="925.0" y="787" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">DiagnosticsEndpoints</text><text x="925.0" y="807" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">getLog: roots only, bounded,</text><text x="925.0" y="824" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">no symlinks; cmdStatus;</text><text x="925.0" y="841" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">appendLogMarker</text><rect x="1160" y="225" width="300" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1310.0" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">Router + MiddlewareChain</text><text x="1310.0" y="267" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">R1: auth before body,</text><text x="1310.0" y="284" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">per-route body limit</text><rect x="1160" y="360" width="300" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1310.0" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">HttpTransport</text><text x="1310.0" y="402" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">R1 interface: upload routes,</text><text x="1310.0" y="419" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">chunked and sized producers</text><rect x="1160" y="495" width="300" height="95" rx="7" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1310.0" y="517" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">CppHttplibTransport</text><text x="1310.0" y="537" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">sets 206 for ranged responses</text><text x="1310.0" y="554" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">body deadline per upload</text><rect x="1540" y="360" width="270" height="80" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1675.0" y="382" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">httplib::Server</text><text x="1675.0" y="402" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">DataSink, ContentReader</text><rect x="1540" y="495" width="270" height="80" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1675.0" y="517" text-anchor="middle" font-size="14" font-weight="400" fill="#172033">httplib::ThreadPool</text><text x="1675.0" y="537" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">one thread per open stream</text><path d="M310 137H340V292H388" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="304" y="207" width="72" height="16" fill="white"/><text x="340" y="220" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">tryPublish</text><path d="M310 280H350V427H388" fill="none" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="314" y="347" width="72" height="16" fill="white"/><text x="350" y="360" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">implements</text><path d="M690 427H730V555H778" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="710" y="487" width="41" height="16" fill="white"/><text x="730" y="500" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">calls</text><path d="M540 475V513" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="549" y="484" width="53" height="16" fill="white"/><text x="576" y="497" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">returns</text><path d="M540 205V243" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="549" y="215" width="53" height="16" fill="white"/><text x="576" y="228" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">returns</text><path d="M690 292H778" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="714" y="271" width="41" height="16" fill="white"/><text x="734" y="284" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">feeds</text><path d="M690 137H778" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="717" y="116" width="35" height="16" fill="white"/><text x="734" y="129" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">owns</text><path d="M925 185V223" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="939" y="194" width="35" height="16" fill="white"/><text x="956" y="207" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">owns</text><path d="M925 320V358" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="938" y="330" width="41" height="16" fill="white"/><text x="958" y="343" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">lease</text><path d="M925 495V457" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="938" y="467" width="41" height="16" fill="white"/><text x="958" y="480" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">lease</text><path d="M925 605V643" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="936" y="615" width="59" height="16" fill="white"/><text x="966" y="628" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">verifies</text><path d="M690 160H740V820H778" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="723" y="747" width="35" height="16" fill="white"/><text x="740" y="760" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">owns</text><path d="M310 455H370V870H760V840H778" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="506" y="849" width="109" height="16" fill="white"/><text x="560" y="862" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">provides records</text><path d="M310 550H330V900H925V877" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="563" y="879" width="115" height="16" fill="white"/><text x="620" y="892" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">reads only within</text><path d="M1070 550H1110V272H1158" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1074" y="407" width="72" height="16" fill="white"/><text x="1110" y="420" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">routes via</text><path d="M1310 320V358" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1325" y="330" width="35" height="16" fill="white"/><text x="1342" y="343" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">uses</text><path d="M1310 455V493" fill="none" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="1318" y="465" width="96" height="16" fill="white"/><text x="1366" y="478" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">implemented by</text><path d="M1460 542H1538" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1482" y="521" width="35" height="16" fill="white"/><text x="1499" y="534" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">uses</text><path d="M1460 405H1538" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1482" y="384" width="35" height="16" fill="white"/><text x="1499" y="397" text-anchor="middle" font-size="11" font-weight="400" fill="#172033">uses</text><text x="30" y="975" text-anchor="start" font-size="13" font-weight="400" fill="#172033">The engine never opens a path a client sends: copy* names resource IDs from the store, and getLog reads only inside the roots the project registered.</text></g></svg>
