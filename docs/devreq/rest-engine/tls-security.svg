<svg xmlns="http://www.w3.org/2000/svg" width="1466" height="903" viewBox="0 0 1466 903"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b42318"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#157347"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Security profiles: HTTP in development, no fallback in production</text><text x="20" y="56" font-size="14">Agreed gigante::restcore architecture. Implemented through R1; items marked R2 or R6 are planned.</text><rect x="706" y="46" width="18" height="14" rx="3" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="730" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">restcore class</text><rect x="856" y="46" width="18" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="880" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Public API</text><rect x="1006" y="46" width="18" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="1030" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">Consuming project</text><rect x="1156" y="46" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="1180" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">cpp-httplib / TLS</text><rect x="1306" y="46" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="1330" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#172033">External</text><path d="M118 128V893" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="22" y="78" width="192" height="50" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/><text x="118" y="99" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">Project code</text><text x="118" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">(domain handlers)</text><path d="M323 128V893" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="227" y="78" width="192" height="50" rx="6" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="323" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">gigante::RestServer</text><path d="M528 128V893" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="432" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="528" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">SecurityPolicy</text><path d="M733 128V893" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="637" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="733" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpTransport</text><text x="733" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">(CppHttplibTransport)</text><path d="M938 128V893" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="842" y="78" width="192" height="50" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="938" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#172033">OpenSSL or Mbed TLS</text><path d="M1143 128V893" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1047" y="78" width="192" height="50" rx="6" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><text x="1143" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">gigante::RestClient</text><path d="M1348 128V893" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1252" y="78" width="192" height="50" rx="6" fill="#cfe2ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1348" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">HttpClientTransport</text><rect x="8" y="142" width="1450" height="24" fill="#e7f6ec"/><text x="16" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Development profile: HTTP by default, on loopback</text><path d="M118 194H321" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="128" y="172" width="185" height="17" fill="white"/><text x="220.5" y="186" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">start(profile=development)</text><path d="M323 225H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="404" y="203" width="44" height="17" fill="white"/><text x="425.5" y="217" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">check</text><path d="M528 256H325" stroke="#315c91" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="336" y="234" width="178" height="17" fill="white"/><text x="425.5" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">HTTP on 127.0.0.1 allowed</text><path d="M323 287H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="469" y="265" width="118" height="17" fill="white"/><text x="528.0" y="279" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">start plain HTTP</text><path d="M528 318h30v20h-28" fill="none" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="562" y="310" width="433" height="17" fill="white"/><text x="566" y="324" text-anchor="start" font-size="12" font-weight="400" fill="#172033">non-loopback HTTP needs an explicit setting, and logs a warning</text><rect x="8" y="352" width="1450" height="24" fill="#fdecea"/><text x="16" y="369" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Production profile: plaintext refused</text><path d="M118 404H321" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="111" y="382" width="218" height="17" fill="white"/><text x="220.5" y="396" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">start(profile=production, http)</text><path d="M323 435H526" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="404" y="413" width="44" height="17" fill="white"/><text x="425.5" y="427" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">check</text><path d="M528 466H325" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="330" y="444" width="191" height="17" fill="white"/><text x="425.5" y="458" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">refused: HTTPS is mandatory</text><path d="M323 497H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="111" y="475" width="218" height="17" fill="white"/><text x="220.5" y="489" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">start fails; no listener opened</text><rect x="8" y="512" width="1450" height="24" fill="#fdecea"/><text x="16" y="529" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Production profile: bad certificate never falls back to HTTP</text><path d="M323 564H731" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="486" y="542" width="84" height="17" fill="white"/><text x="528.0" y="556" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">start HTTPS</text><path d="M733 595H936" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="750" y="573" width="171" height="17" fill="white"/><text x="835.5" y="587" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">load certificate and key</text><path d="M938 626H735" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="814" y="604" width="44" height="17" fill="white"/><text x="835.5" y="618" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">error</text><path d="M733 657H325" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="412" y="635" width="232" height="17" fill="white"/><text x="528.0" y="649" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">failed: backend, operation, cause</text><path d="M323 688H120" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="111" y="666" width="218" height="17" fill="white"/><text x="220.5" y="680" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">start fails; no listener opened</text><rect x="8" y="703" width="1450" height="24" fill="#fdecea"/><text x="16" y="720" text-anchor="start" font-size="13" font-weight="700" fill="#172033">Client: peer verification stays on</text><path d="M1143 755H530" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="693" y="733" width="286" height="17" fill="white"/><text x="835.5" y="747" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">http:// or verification off in production</text><path d="M528 786H1141" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="807" y="764" width="57" height="17" fill="white"/><text x="835.5" y="778" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">refused</text><path d="M1143 817H1346" stroke="#315c91" stroke-width="1.4" marker-end="url(#a)"/><rect x="1116" y="795" width="259" height="17" fill="white"/><text x="1245.5" y="809" text-anchor="middle" font-size="12" font-weight="400" fill="#172033">request to wrong host or untrusted CA</text><path d="M1348 848H1145" stroke="#b42318" stroke-width="1.4" marker-end="url(#r)"/><rect x="1133" y="826" width="225" height="17" fill="white"/><text x="1245.5" y="840" text-anchor="middle" font-size="12" font-weight="400" fill="#b42318">verification error, no data sent</text></g></svg>
