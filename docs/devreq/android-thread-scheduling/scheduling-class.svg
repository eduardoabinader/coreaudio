<text x="1260" y="103" text-anchor="middle" font-family="Arial" font-size="14">Custom scheduler / worker</text>
<path d="M1260 123V675" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="1447" y="75" width="346" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="1620" y="103" text-anchor="middle" font-family="Arial" font-size="14">Android OS / observer</text>
<path d="M1620 123V675" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="15" y="141" width="1770" height="24" fill="white"/>
<text x="22" y="158" font-family="Arial" font-size="14">1. Validated build setting selects legacy (unchanged default) or juce mode</text>
<path d="M180 173 H540" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="216" width="1770" height="24" fill="white"/>
<text x="22" y="233" font-family="Arial" font-size="14">2. Both modes preserve the pinned JUCE 9.0.4 device path and custom device-selection safeguards</text>
<path d="M180 248 H900" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="291" width="1770" height="24" fill="white"/>
<text x="22" y="308" font-family="Arial" font-size="14">3. Legacy mode keeps the current preparation, callback scheduling attempts and worker</text>
<path d="M540 323 H1260" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="366" width="1770" height="24" fill="white"/>
<text x="22" y="383" font-family="Arial" font-size="14">4. JUCE mode makes the compatibility calls empty; no extra scheduling or worker startup</text>
<path d="M540 398 h65 v18 h-65" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="441" width="1770" height="24" fill="white"/>
<text x="22" y="458" font-family="Arial" font-size="14">5. JUCE mode relies on the existing native callback/stream scheduling behavior</text>
<path d="M900 473 H1620" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="516" width="1770" height="24" fill="white"/>
<text x="22" y="533" font-family="Arial" font-size="14">6. JUCE build excludes the custom scheduler source; artifact checks verify exclusion</text>
<path d="M1260 548 h65 v18 h-65" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="591" width="1770" height="24" fill="white"/>
<text x="22" y="608" font-family="Arial" font-size="14">7. No new shared scheduler abstraction, source retirement or default-policy change in this phase</text>
<path d="M180 623 h65 v18 h-65" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
