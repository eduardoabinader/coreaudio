<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="590" viewBox="0 0 1800 590">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#315c91"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="20" y="30" font-family="Arial" font-size="22">C3B: callback processing without a custom scheduler worker</text>
<text x="20" y="54" font-family="Arial" font-size="14">C3B approved scope — REQ-AM02/AM04 and REQ-O20/O21 — verification tracked separately</text>
<rect x="10" y="75" width="340" height="44" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="180" y="102" text-anchor="middle" font-family="Arial" font-size="14">Kuaru synthesizer</text>
<path d="M180 123V580" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="370" y="75" width="340" height="44" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="540" y="102" text-anchor="middle" font-family="Arial" font-size="14">JUCE Oboe / OpenSLES device</text>
<path d="M540 123V580" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="730" y="75" width="340" height="44" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="900" y="102" text-anchor="middle" font-family="Arial" font-size="14">Android OS</text>
<path d="M900 123V580" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="1090" y="75" width="340" height="44" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="1260" y="102" text-anchor="middle" font-family="Arial" font-size="14">SessionPreparation / adapter</text>
<path d="M1260 123V580" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="1450" y="75" width="340" height="44" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="1620" y="102" text-anchor="middle" font-family="Arial" font-size="14">Evidence observer</text>
<path d="M1620 123V580" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="15" y="139" width="1770" height="24" fill="white"/>
<text x="22" y="155" font-family="Arial" font-size="14">1. Backend invokes processing; OpenSLES may also synchronously prime buffers</text>
<path d="M540 171 H180" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="221" width="1770" height="24" fill="white"/>
<text x="22" y="237" font-family="Arial" font-size="14">2. Render existing DSP; no first-call scheduling atomic, JNI call or priority request</text>
<path d="M180 253 h65 v18 h-65" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="303" width="1770" height="24" fill="white"/>
<text x="22" y="319" font-family="Arial" font-size="14">3. Framework and OS retain responsibility for render-thread scheduling</text>
<path d="M540 335 H900" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="385" width="1770" height="24" fill="white"/>
<text x="22" y="401" font-family="Arial" font-size="14">4. Inspect active track counters and per-thread policy independently</text>
<path d="M1620 417 H900" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="467" width="1770" height="24" fill="white"/>
<text x="22" y="483" font-family="Arial" font-size="14">5. Collect existing profile snapshots; app interval heuristic is not native underruns</text>
<path d="M1620 499 H180" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
</svg>
