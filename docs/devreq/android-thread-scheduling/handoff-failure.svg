<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="685" viewBox="0 0 1800 685">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#315c91"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="20" y="30" font-family="Arial" font-size="22">C3A: configuration, measurement and regression failures</text>
<text x="20" y="54" font-family="Arial" font-size="14">C3A implemented — Pixel comparison verified — default legacy; retirement deferred</text>
<rect x="7" y="75" width="346" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="180" y="103" text-anchor="middle" font-family="Arial" font-size="14">SinukaruPianoSynthesizer</text>
<path d="M180 123V675" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="367" y="75" width="346" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="540" y="103" text-anchor="middle" font-family="Arial" font-size="14">AndroidPerformanceOptimizer</text>
<path d="M540 123V675" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="727" y="75" width="346" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="900" y="103" text-anchor="middle" font-family="Arial" font-size="14">JUCE Oboe/OpenSL device</text>
<path d="M900 123V675" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="1087" y="75" width="346" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="1260" y="103" text-anchor="middle" font-family="Arial" font-size="14">Custom scheduler / worker</text>
<path d="M1260 123V675" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="1447" y="75" width="346" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="1620" y="103" text-anchor="middle" font-family="Arial" font-size="14">Android OS / observer</text>
<path d="M1620 123V675" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="15" y="141" width="1770" height="24" fill="white"/>
<text x="22" y="158" font-family="Arial" font-size="14">1. Reject unknown mode values; default remains legacy</text>
<path d="M540 173 h65 v18 h-65" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="216" width="1770" height="24" fill="white"/>
<text x="22" y="233" font-family="Arial" font-size="14">2. Packaged-library audit verifies custom worker present in baseline and absent in JUCE mode</text>
<path d="M540 248 H1260" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="291" width="1770" height="24" fill="white"/>
<text x="22" y="308" font-family="Arial" font-size="14">3. Requested low latency or high priority alone is not performance acceptance</text>
<path d="M900 323 H1620" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="366" width="1770" height="24" fill="white"/>
<text x="22" y="383" font-family="Arial" font-size="14">4. Changed route/rate/buffer settings invalidate the pair until matched</text>
<path d="M180 398 H1620" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="441" width="1770" height="24" fill="white"/>
<text x="22" y="458" font-family="Arial" font-size="14">5. Unavailable xruns or timing are evidence gaps, never zero measurements</text>
<path d="M180 473 h65 v18 h-65" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="516" width="1770" height="24" fill="white"/>
<text x="22" y="533" font-family="Arial" font-size="14">6. Regression retains the existing default; no added priority fallback or automatic retuning</text>
<path d="M180 548 h65 v18 h-65" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="591" width="1770" height="24" fill="white"/>
<text x="22" y="608" font-family="Arial" font-size="14">7. A later approved retirement phase requires enough independent performance and lifecycle evidence</text>
<path d="M180 623 h65 v18 h-65" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
</svg>
