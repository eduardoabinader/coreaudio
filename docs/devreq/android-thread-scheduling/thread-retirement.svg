<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="672" viewBox="0 0 1800 672">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#315c91"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="20" y="30" font-family="Arial" font-size="22">C3B: stream replacement, shutdown and development restoration</text>
<text x="20" y="54" font-family="Arial" font-size="14">C3B approved scope — REQ-AM02/AM04 and REQ-O20/O21 — verification tracked separately</text>
<rect x="10" y="75" width="340" height="44" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="180" y="102" text-anchor="middle" font-family="Arial" font-size="14">Kuaru synthesizer</text>
<path d="M180 123V662" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="370" y="75" width="340" height="44" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="540" y="102" text-anchor="middle" font-family="Arial" font-size="14">JUCE Oboe / OpenSLES device</text>
<path d="M540 123V662" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="730" y="75" width="340" height="44" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="900" y="102" text-anchor="middle" font-family="Arial" font-size="14">Android OS</text>
<path d="M900 123V662" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="1090" y="75" width="340" height="44" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="1260" y="102" text-anchor="middle" font-family="Arial" font-size="14">SessionPreparation / adapter</text>
<path d="M1260 123V662" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="1450" y="75" width="340" height="44" rx="6" fill="#e6f1ff" stroke="#315c91"/>
<text x="1620" y="102" text-anchor="middle" font-family="Arial" font-size="14">Evidence observer</text>
<path d="M1620 123V662" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="15" y="139" width="1770" height="24" fill="white"/>
<text x="22" y="155" font-family="Arial" font-size="14">1. Cold start, idle/resume and Home/return use the existing device lifecycle</text>
<path d="M180 171 H540" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="221" width="1770" height="24" fill="white"/>
<text x="22" y="237" font-family="Arial" font-size="14">2. Reopen stream for buffer change; JUCE may replace callback threads</text>
<path d="M180 253 H540" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="303" width="1770" height="24" fill="white"/>
<text x="22" y="319" font-family="Arial" font-size="14">3. Observe replacement thread policy; require no custom scheduling events</text>
<path d="M1620 335 H900" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="385" width="1770" height="24" fill="white"/>
<text x="22" y="401" font-family="Arial" font-size="14">4. Existing power-button teardown releases session resources</text>
<path d="M180 417 H1260" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="467" width="1770" height="24" fill="white"/>
<text x="22" y="483" font-family="Arial" font-size="14">5. Check native service/lock release and fresh launch</text>
<path d="M1620 499 H900" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
<rect x="15" y="549" width="1770" height="24" fill="white"/>
<text x="22" y="565" font-family="Arial" font-size="14">6. Restore normal Oboe dev; other consumers retain their shared scheduler</text>
<path d="M1620 581 H180" stroke="#315c91" fill="none" marker-end="url(#arrow)"/>
</svg>
