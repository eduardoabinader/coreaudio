<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="691" viewBox="0 0 1860 691"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Focus changes: held-note parity and native callback lifetime</text><text x="20" y="54" font-size="14">Proposed Android C1: focus migration only; implementation awaits standalone go.</text><rect x="6" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="155" y="103" text-anchor="middle" font-size="12">SinuAudioFocus / Kuaru adapter</text><path d="M155 123V679" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="316" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="465" y="103" text-anchor="middle" font-size="12">SessionPreparation / ManagedSession</text><path d="M465 123V679" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="626" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="775" y="103" text-anchor="middle" font-size="12">AndroidSessionPreparation</text><path d="M775 123V679" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="936" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1085" y="103" text-anchor="middle" font-size="12">AndroidAudioFocusDriver (JNI)</text><path d="M1085 123V679" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1246" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1395" y="103" text-anchor="middle" font-size="12">AudioFocusListener (Java)</text><path d="M1395 123V679" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1556" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1705" y="103" text-anchor="middle" font-size="12">Android AudioManager</text><path d="M1705 123V679" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="15" y="143" width="1830" height="23" fill="white"/><text x="22" y="160" font-size="14">1. AudioManager posts focus change to the shared listener; listener forwards token plus raw change code.</text><path d="M1705 167H1395" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="216" width="1830" height="23" fill="white"/><text x="22" y="233" font-size="14">2. JNI lookup validates token and obtains a lifetime-safe event sink; never dereference a raw consumer pointer.</text><path d="M1395 240H1085" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="289" width="1830" height="23" fill="white"/><text x="22" y="306" font-size="14">3. Negative LOSS / LOSS_TRANSIENT / LOSS_TRANSIENT_CAN_DUCK become interruption-began facts with raw code.</text><path d="M1085 313H775" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="362" width="1830" height="23" fill="white"/><text x="22" y="379" font-size="14">4. Reuse ManagedSession serialization and stale-generation rejection; record raw focus observation.</text><path d="M775 386H465" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="435" width="1830" height="23" fill="white"/><text x="22" y="452" font-size="14">5. Existing Kuaru adapter invokes focus-loss handler; SafePointer dispatch releases held touches on message thread.</text><path d="M465 459H155" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="508" width="1830" height="23" fill="white"/><text x="22" y="525" font-size="14">6. GAIN becomes interruption-ended with raw code; missing resume hint remains unknown.</text><path d="M1705 532H775" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="581" width="1830" height="23" fill="white"/><text x="22" y="598" font-size="14">7. Gain never replays held notes, opens JUCE devices or re-requests focus. Device audio policy remains unchanged.</text><path d="M465 605H155" stroke="#315c91" marker-end="url(#a)"/></g></svg>
