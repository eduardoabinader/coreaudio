<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="764" viewBox="0 0 1860 764"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Denied request, JNI failure and ordered release</text><text x="20" y="54" font-size="14">Proposed Android C1: focus migration only; implementation awaits standalone go.</text><rect x="6" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="155" y="103" text-anchor="middle" font-size="12">SinuAudioFocus / Kuaru adapter</text><path d="M155 123V752" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="316" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="465" y="103" text-anchor="middle" font-size="12">SessionPreparation / ManagedSession</text><path d="M465 123V752" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="626" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="775" y="103" text-anchor="middle" font-size="12">AndroidSessionPreparation</text><path d="M775 123V752" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="936" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1085" y="103" text-anchor="middle" font-size="12">AndroidAudioFocusDriver (JNI)</text><path d="M1085 123V752" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1246" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1395" y="103" text-anchor="middle" font-size="12">AudioFocusListener (Java)</text><path d="M1395 123V752" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1556" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1705" y="103" text-anchor="middle" font-size="12">Android AudioManager</text><path d="M1705 123V752" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="15" y="143" width="1830" height="23" fill="white"/><text x="22" y="160" font-size="14">1. Denied/delayed request or missing JNI/context/class returns explicit result; no successful no-op.</text><path d="M1085 167H775" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="216" width="1830" height="23" fill="white"/><text x="22" y="233" font-size="14">2. Register no accepted callback on failed preparation; remove partial listener/token/reference state.</text><path d="M775 240H465" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="289" width="1830" height="23" fill="white"/><text x="22" y="306" font-size="14">3. Preserve request result and original error, plus cleanup error separately; Android startup policy stays nonfatal.</text><path d="M465 313H155" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="362" width="1830" height="23" fill="white"/><text x="22" y="379" font-size="14">4. Stop product audio using existing lifecycle, then abandon shared focus; no wake-lock/service migration.</text><path d="M155 386H465" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="435" width="1830" height="23" fill="white"/><text x="22" y="452" font-size="14">5. Disable event acceptance and invalidate generation/token before native listener cleanup.</text><path d="M465 459H1085" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="508" width="1830" height="23" fill="white"/><text x="22" y="525" font-size="14">6. Abandon original AudioFocusRequest; retain failure and global references for safe explicit retry where required.</text><path d="M1085 532H1705" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="581" width="1830" height="23" fill="white"/><text x="22" y="598" font-size="14">7. External release waits safely for in-flight callback; callback-side release never waits on itself.</text><path d="M1085 605H465" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="654" width="1830" height="23" fill="white"/><text x="22" y="671" font-size="14">8. Repeated release/destruction and late native callbacks are tested; remove legacy product listener only after parity acceptance.</text><path d="M465 678H155" stroke="#315c91" marker-end="url(#a)"/></g></svg>
