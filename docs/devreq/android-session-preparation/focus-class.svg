<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="691" viewBox="0 0 1860 691"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Android focus: shared mechanism and consumer boundaries</text><text x="20" y="54" font-size="14">Android C1: focus migration only; host and device evidence tracked separately.</text><rect x="6" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="155" y="103" text-anchor="middle" font-size="12">SinuAudioFocus / Kuaru adapter</text><path d="M155 123V679" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="316" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="465" y="103" text-anchor="middle" font-size="12">SessionPreparation / ManagedSession</text><path d="M465 123V679" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="626" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="775" y="103" text-anchor="middle" font-size="12">AndroidSessionPreparation</text><path d="M775 123V679" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="936" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1085" y="103" text-anchor="middle" font-size="12">AndroidAudioFocusDriver (JNI)</text><path d="M1085 123V679" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1246" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1395" y="103" text-anchor="middle" font-size="12">AudioFocusListener (Java)</text><path d="M1395 123V679" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1556" y="75" width="298" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1705" y="103" text-anchor="middle" font-size="12">Android AudioManager</text><path d="M1705 123V679" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="15" y="143" width="1830" height="23" fill="white"/><text x="22" y="160" font-size="14">1. Kuaru adapter owns an explicit Android-created SessionPreparation instance; neutral public contract has no JNI types.</text><path d="M155 167H465" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="216" width="1830" height="23" fill="white"/><text x="22" y="233" font-size="14">2. ManagedSession wraps AndroidSessionPreparation through existing private SessionPreparationImplementation.</text><path d="M465 240H775" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="289" width="1830" height="23" fill="white"/><text x="22" y="306" font-size="14">3. Backend owns injected AndroidAudioFocusDriver; desktop tests provide a fake, JNI driver handles native operations.</text><path d="M775 313H1085" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="362" width="1830" height="23" fill="white"/><text x="22" y="379" font-size="14">4. Android-only factory receives VM/context/listener class from consumer; retain global references and register native callback.</text><path d="M1085 386H1395" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="435" width="1830" height="23" fill="white"/><text x="22" y="452" font-size="14">5. Shared Java listener only forwards audio-focus changes with a generation-safe token; no Kuaru class/package dependency.</text><path d="M1395 459H1705" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="508" width="1830" height="23" fill="white"/><text x="22" y="525" font-size="14">6. Report requested attributes/gain, grant result, raw observed focus change and errors; startup-denial policy stays product-owned.</text><path d="M465 532H155" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="581" width="1830" height="23" fill="white"/><text x="22" y="598" font-size="14">7. Current foreground service, locks and scheduler stay unchanged; no JNI_OnLoad replacement, endpoint work or AHIO adoption.</text><path d="M155 605H1705" stroke="#315c91" marker-end="url(#a)"/></g></svg>
