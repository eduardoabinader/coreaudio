<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="750" viewBox="0 0 1680 750"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Native events, callback release and external teardown</text><text x="20" y="54" font-size="14">Phase A implementation; iOS runtime acceptance awaits separate Kuaru adoption phase B.</text><rect x="7" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="140" y="103" text-anchor="middle" font-size="13">Consumer adapter</text><path d="M140 122V738" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="287" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="420" y="103" text-anchor="middle" font-size="13">SessionPreparation</text><path d="M420 122V738" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="567" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="700" y="103" text-anchor="middle" font-size="13">ManagedSession / SessionState</text><path d="M700 122V738" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="847" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="980" y="103" text-anchor="middle" font-size="13">SessionPreparationImplementation</text><path d="M980 122V738" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1127" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1260" y="103" text-anchor="middle" font-size="13">IosSessionPreparation</text><path d="M1260 122V738" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1407" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1540" y="103" text-anchor="middle" font-size="13">AVAudioSession</text><path d="M1540 122V738" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="15" y="142" width="1650" height="24" fill="white"/><text x="22" y="159" font-size="14">1. Native interruption/route/media-services notification carries resume hint or route reason when supplied.</text><path d="M1540 167H1260" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="212" width="1650" height="24" fill="white"/><text x="22" y="229" font-size="14">2. Forward event via weak SessionState plus generation; serialize on recursive gate, outside realtime.</text><path d="M1260 237H700" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="282" width="1650" height="24" fill="white"/><text x="22" y="299" font-size="14">3. Publish callback; interrupted/lost/reset state never claims successful native recovery.</text><path d="M700 307H140" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="352" width="1650" height="24" fill="white"/><text x="22" y="369" font-size="14">4. Callback may call release (or destroy its consumer session) without waiting on itself.</text><path d="M140 377H700" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="422" width="1650" height="24" fill="white"/><text x="22" y="439" font-size="14">5. External release waits for in-flight callback gate, then disables delivery and invalidates generation.</text><path d="M140 447H700" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="492" width="1650" height="24" fill="white"/><text x="22" y="509" font-size="14">6. Remove observers without waiting for the current notification; deactivate owned session.</text><path d="M700 517H1260" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="562" width="1650" height="24" fill="white"/><text x="22" y="579" font-size="14">7. Deactivation failure remains explicit and retains ownership for an explicit release retry.</text><path d="M1260 587H1540" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="632" width="1650" height="24" fill="white"/><text x="22" y="649" font-size="14">8. No new callback after release returns; late notifications and previous generations are discarded.</text><path d="M700 657H140" stroke="#315c91" marker-end="url(#a)"/></g></svg>
