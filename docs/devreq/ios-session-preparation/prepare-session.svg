<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="750" viewBox="0 0 1680 750"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">Preparation: native success, failure and unsupported platforms</text><text x="20" y="54" font-size="14">Phase A implementation; iOS runtime acceptance awaits separate Kuaru adoption phase B.</text><rect x="7" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="140" y="103" text-anchor="middle" font-size="13">Consumer adapter</text><path d="M140 122V738" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="287" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="420" y="103" text-anchor="middle" font-size="13">SessionPreparation</text><path d="M420 122V738" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="567" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="700" y="103" text-anchor="middle" font-size="13">ManagedSession / SessionState</text><path d="M700 122V738" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="847" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="980" y="103" text-anchor="middle" font-size="13">SessionPreparationImplementation</text><path d="M980 122V738" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1127" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1260" y="103" text-anchor="middle" font-size="13">IosSessionPreparation</text><path d="M1260 122V738" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1407" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1540" y="103" text-anchor="middle" font-size="13">AVAudioSession</text><path d="M1540 122V738" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="15" y="142" width="1650" height="24" fill="white"/><text x="22" y="159" font-size="14">1. prepare(playback request, callback): reject empty callback or unsupported intent; active repeat retains originals.</text><path d="M140 167H420" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="212" width="1650" height="24" fill="white"/><text x="22" y="229" font-size="14">2. ManagedSession allocates a new notification generation; failed cleanup requires explicit release retry.</text><path d="M420 237H700" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="282" width="1650" height="24" fill="white"/><text x="22" y="299" font-size="14">3. Call injected backend. Non-iOS production backend returns unavailable; no successful no-op.</text><path d="M700 307H980" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="352" width="1650" height="24" fill="white"/><text x="22" y="369" font-size="14">4. iOS backend claims process lease; reject a second prepared instance without altering the first.</text><path d="M980 377H1260" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="422" width="1650" height="24" fill="white"/><text x="22" y="439" font-size="14">5. Apply playback category/default mode and activate; retain requested, applied and observed outcomes.</text><path d="M1260 447H1540" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="492" width="1650" height="24" fill="white"/><text x="22" y="509" font-size="14">6. Success: register notification observers; return active activation outcome, never device readiness.</text><path d="M1260 517H700" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="562" width="1650" height="24" fill="white"/><text x="22" y="579" font-size="14">7. Failure: preserve native operation/domain/code/message and completed steps; wrapper invokes cleanup.</text><path d="M1260 587H700" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="632" width="1650" height="24" fill="white"/><text x="22" y="649" font-size="14">8. Return original error plus any cleanup error; partial cleanup cannot hide the preparation failure.</text><path d="M700 657H140" stroke="#315c91" marker-end="url(#a)"/></g></svg>
