<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="680" viewBox="0 0 1680 680"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#315c91"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22">SessionPreparation: implemented classes and ownership</text><text x="20" y="54" font-size="14">Phase A implementation; iOS runtime acceptance awaits separate Kuaru adoption phase B.</text><rect x="7" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="140" y="103" text-anchor="middle" font-size="13">Consumer adapter</text><path d="M140 122V668" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="287" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="420" y="103" text-anchor="middle" font-size="13">SessionPreparation</text><path d="M420 122V668" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="567" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="700" y="103" text-anchor="middle" font-size="13">ManagedSession / SessionState</text><path d="M700 122V668" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="847" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="980" y="103" text-anchor="middle" font-size="13">SessionPreparationImplementation</text><path d="M980 122V668" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1127" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1260" y="103" text-anchor="middle" font-size="13">IosSessionPreparation</text><path d="M1260 122V668" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="1407" y="75" width="266" height="45" rx="6" fill="#e6f1ff" stroke="#315c91"/><text x="1540" y="103" text-anchor="middle" font-size="13">AVAudioSession</text><path d="M1540 122V668" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="15" y="142" width="1650" height="24" fill="white"/><text x="22" y="159" font-size="14">1. Consumer owns unique_ptr&lt;SessionPreparation&gt;; create() returns ManagedSession.</text><path d="M140 167H420" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="212" width="1650" height="24" fill="white"/><text x="22" y="229" font-size="14">2. ManagedSession implements the public interface; shared SessionState gates callbacks and stale generations.</text><path d="M700 237H420" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="282" width="1650" height="24" fill="white"/><text x="22" y="299" font-size="14">3. ManagedSession owns a private backend through SessionPreparationImplementation.</text><path d="M700 307H980" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="352" width="1650" height="24" fill="white"/><text x="22" y="369" font-size="14">4. IosSessionPreparation implements the private backend; desktop contract tests inject FakeSessionPreparationImplementation.</text><path d="M1260 377H980" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="422" width="1650" height="24" fill="white"/><text x="22" y="439" font-size="14">5. iOS backend owns category/mode, activation and notification tokens; native types stay private.</text><path d="M1260 447H1540" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="492" width="1650" height="24" fill="white"/><text x="22" y="509" font-size="14">6. SessionReport separates request, applied steps, observed category/mode, primary/cleanup/callback errors.</text><path d="M420 517H140" stroke="#315c91" marker-end="url(#a)"/><rect x="15" y="562" width="1650" height="24" fill="white"/><text x="22" y="579" font-size="14">7. One prepared shared instance per process. JUCE still independently owns native device recovery; no DSP dependency.</text><path d="M140 587H1540" stroke="#315c91" marker-end="url(#a)"/></g></svg>
